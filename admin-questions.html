<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>문제 회차 관리</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-soft: #f9fbfc;
      --ink: #1f2933;
      --muted: #66727f;
      --line: #d8e0e6;
      --accent: #256d7b;
      --accent-2: #3858a6;
      --ok: #17654f;
      --warn: #8a5a14;
      --danger: #b93838;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "SUIT", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    a { color: inherit; text-decoration: none; }
    button, .button {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    button.primary, .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.secondary, .button.secondary { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
    button.ghost, .button.ghost { background: transparent; }
    button:disabled, .button.disabled {
      opacity: .48;
      cursor: not-allowed;
      pointer-events: none;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      padding: 9px 10px;
      font-size: 13px;
    }
    .container {
      width: min(1420px, 94vw);
      margin: 0 auto;
      padding: 24px 0 48px;
    }
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    h2 { margin: 0; font-size: 17px; letter-spacing: 0; }
    .desc { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .top .desc { margin-top: 7px; }
    .actions, .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .panel {
      margin-top: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(31,41,51,.04);
    }
    .panelHead {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .panelBody { padding: 16px; }
    .summaryGrid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }
    .countBox {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      min-height: 68px;
    }
    .countBox strong { display: block; font-size: 20px; }
    .countBox span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
    .filterBar {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) minmax(140px, .65fr) minmax(150px, .7fr) minmax(240px, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .tableWrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
      background: #fff;
      max-height: 70vh;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 1080px;
    }
    #questionTable {
      width: 100%;
      min-width: 0;
      table-layout: fixed;
    } /* SOFTM-ADMIN: 문제 회차 테이블을 패널 폭 100%에 맞춤 - 2026-06-16 */
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      text-align: left;
      vertical-align: middle;
    }
    th {
      position: sticky;
      top: 0;
      background: #f7f9fb;
      z-index: 1;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    #questionTable th:nth-child(1), #questionTable td:nth-child(1) { width: 40%; }
    #questionTable th:nth-child(2), #questionTable td:nth-child(2) { width: 22%; }
    #questionTable th:nth-child(3), #questionTable td:nth-child(3) { width: 20%; }
    #questionTable th:nth-child(4), #questionTable td:nth-child(4) { width: 18%; }
    .selectableRow { cursor: pointer; }
    .selectableRow:hover { background: #f9fbfc; }
    .selectableRow.selected { background: #eef8f7; }
    .cellTitle { font-weight: 700; line-height: 1.35; }
    .cellSub { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .pathCell {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      word-break: break-all;
    }
    .questionTitleLine {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }
    .stateGrid,
    .structureGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .stateItem,
    .structureItem {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      padding: 7px 8px;
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .stateItem span,
    .structureItem span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
    }
    .stateItem strong,
    .structureItem strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1.2;
    }
    .stateItem strong.ok,
    .structureItem strong.ok { color: var(--ok); }
    .stateItem strong.warn,
    .structureItem strong.warn { color: var(--warn); }
    .stateItem strong.danger,
    .structureItem strong.danger { color: var(--danger); }
    .stateItem strong.edit,
    .structureItem strong.edit { color: var(--accent); }
    .stateItem strong.muted,
    .structureItem strong.muted { color: var(--muted); }
    .pdfTextInline {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pdfTextInline strong {
      min-width: 0;
      flex: 1;
    }
    .pdfTextMore {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
      cursor: pointer;
    }
    .pdfTextMore:hover { color: var(--accent); border-color: #aac0ff; }
    .pdfTextPopover {
      position: fixed;
      z-index: 3000;
      width: min(360px, calc(100vw - 24px));
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 18px 44px rgba(15, 23, 42, .18);
      padding: 12px;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
    }
    .pdfTextPopover h3 { margin: 0 0 8px; font-size: 14px; }
    .pdfTextPopover .metricList { display: grid; gap: 5px; margin: 0 0 10px; }
    .pdfTextPopover .metricRow { display: flex; justify-content: space-between; gap: 10px; }
    .pdfTextPopover .metricRow span:first-child { color: var(--muted); }
    .pdfTextPopover .metricRow strong { text-align: right; }
    .pdfTextPopover .note { color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
    .pdfTextPopover ul { margin: 6px 0 0; padding-left: 18px; }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      background: #fff;
      white-space: nowrap;
    }
    .pill.ok { color: var(--ok); background: #effaf5; border-color: #c9e8db; }
    .pill.warn { color: var(--warn); background: #fff7e8; border-color: #f0dbb5; }
    .pill.danger { color: var(--danger); background: #fff0f0; border-color: #f0c2c2; }
    .infoSummary {
      margin-top: 8px;
      display: grid;
      gap: 5px;
    }
    .infoGroup {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: start;
      gap: 7px;
    }
    .infoGroupLabel {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 22px;
    }
    .chipRow {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .infoChip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 7px;
      background: #fff;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }
    .infoChip.ok { color: var(--ok); background: #effaf5; border-color: #c9e8db; }
    .infoChip.warn { color: var(--warn); background: #fff7e8; border-color: #f0dbb5; }
    .infoChip.danger { color: var(--danger); background: #fff0f0; border-color: #f0c2c2; }
    .infoChip.edit { color: var(--accent); background: #eef8f9; border-color: #b7d6dc; }
    .infoChip.muted { color: var(--muted); background: #f7f9fb; border-color: var(--line); }
    .actionGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      min-width: 220px;
    }
    .actionGrid .button {
      width: 100%;
      min-width: 0;
      padding-inline: 8px;
    }
    .empty {
      color: var(--muted);
      padding: 18px;
      text-align: center;
    }
    .toastRegion {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      display: grid;
      gap: 8px;
      width: min(420px, calc(100vw - 36px));
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      box-shadow: 0 14px 30px rgba(31,41,51,.13);
      padding: 11px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }
    .toast.error { border-left-color: var(--danger); }
    .toast.warn { border-left-color: var(--warn); }
    .toast.ok { border-left-color: var(--ok); }
    .toastTitle { font-weight: 700; font-size: 13px; }
    .toastMessage { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .toastClose {
      border: 0;
      padding: 2px 4px;
      height: 24px;
      background: transparent;
      color: var(--muted);
    }
    @media (max-width: 980px) {
      .summaryGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filterBar { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .container { width: min(96vw, 760px); padding-top: 18px; }
      h1 { font-size: 23px; }
      .summaryGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="toastRegion" class="toastRegion" aria-live="polite" aria-atomic="false"></div>

  <main class="container">
    <div class="top">
      <div>
        <h1>문제 회차 관리</h1>
        <div class="desc">회차별 상태, 진단, 문항 구조, 위치맵 상태를 확인하고 상세 진단 화면으로 이동합니다.</div>
      </div>
      <div class="actions">
        <a class="button" href="./admin.html">관리자 메인</a>
        <a class="button" href="./index.html">풀이 메인</a>
        <button id="btnRefresh" class="primary" type="button">새로고침</button>
      </div>
    </div>

    <section class="summaryGrid" id="questionCounts"></section>

    <section class="panel">
      <div class="panelHead">
        <div>
          <h2>회차 목록</h2>
          <div class="desc" id="questionMeta">로딩 중</div>
        </div>
        <div class="row">
          <button id="btnClearFilter" class="ghost" type="button">필터 초기화</button>
        </div>
      </div>
      <div class="panelBody">
        <div class="filterBar">
          <input id="questionSearch" placeholder="카테고리, 과목명, 파일명 검색" />
          <select id="datasetFilter">
            <option value="">전체 구분</option>
          </select>
          <select id="statusFilter">
            <option value="">전체 상태</option>
            <option value="published">게시</option>
            <option value="unpublished">미게시</option>
            <option value="warning">확인 필요</option>
            <option value="initial">초기 상태</option>
            <option value="anchor-missing">위치맵 미생성</option>
            <option value="manual-edited">위치맵 수정</option>
            <option value="question-area-edited">문항영역 수정</option>
            <option value="derived-pdf">OCR 사본</option>
          </select>
          <select id="categoryFilter">
            <option value="">전체 카테고리</option>
          </select>
        </div>

        <div class="tableWrap">
          <table id="questionTable">
            <thead>
              <tr>
                <th>회차</th>
                <th>상태 / 진단</th>
                <th>문항 / 위치</th>
                <th>작업</th>
              </tr>
            </thead>
            <tbody id="questionRows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const ADMIN_QUESTIONS_STATE_KEY = "quiz-admin-questions-state-v1";
    const state = {
      catalog: { categories: [], questions: [] },
      pendingListState: readQuestionsState(),
      listStateApplied: false,
      selectedCategoryKey: "",
      selectedQuestionKey: "",
    };

    function escapeHtml(value){
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalizePath(value){
      return String(value || "").replace(/^\.\//, "").replace(/^quiz\//, "");
    }

    function fileNameFromPath(value){
      const normalized = normalizePath(value);
      const parts = normalized.split(/[\\/]/).filter(Boolean);
      return parts.length ? parts[parts.length - 1] : "";
    }

    function folderNameFromPath(value){
      const normalized = normalizePath(value);
      const parts = normalized.split(/[\\/]/).filter(Boolean);
      parts.pop();
      return parts.join("/");
    }

    function adminApiUrl(value){
      const target = String(value || "");
      if (!target.startsWith("/api/admin/")) return target;
      if (location.protocol === "http:" && location.port === "8787") return target;
      const localHost = location.hostname === "127.0.0.1" ? "127.0.0.1" : "localhost";
      return `http://${localHost}:8787${target}`;
    }

    async function api(path, options = {}){
      const res = await fetch(adminApiUrl(path), { cache: "no-store", ...options });
      const type = res.headers.get("content-type") || "";
      if (!type.includes("application/json")) {
        throw new Error("관리 기능은 Node 관리자 서버에서만 가능합니다. npm run admin 실행 후 http://localhost:8787/admin.html 로 접속하세요.");
      }
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.message || data.error || "요청 실패");
      return data;
    }

    function showToast(message, options = {}){
      const region = $("toastRegion");
      const toast = document.createElement("div");
      const tone = options.tone || "info";
      toast.className = `toast ${tone}`;
      toast.setAttribute("role", tone === "error" ? "alert" : "status");
      toast.innerHTML = `
        <div>
          <div class="toastTitle">${escapeHtml(options.title || (tone === "error" ? "오류" : tone === "warn" ? "확인 필요" : "알림"))}</div>
          <div class="toastMessage">${escapeHtml(message)}</div>
        </div>
        <button class="toastClose" type="button" aria-label="알림 닫기">×</button>
      `;
      toast.querySelector(".toastClose").addEventListener("click", () => toast.remove());
      region.appendChild(toast);
      window.setTimeout(() => toast.remove(), Number(options.timeout || (tone === "error" ? 7000 : 4200)));
    }

    function categoryKey(item){
      return `${item.dataset}:${item.catNo}`;
    }

    function questionKey(item){
      return `${item.dataset}:${item.questionNo}`;
    }

    function categoryDescendantKeys(key){
      if (!key) return new Set();
      const [dataset, catNo] = key.split(":");
      const out = new Set([key]);
      let changed = true;
      while (changed) {
        changed = false;
        for (const category of state.catalog.categories) {
          const current = categoryKey(category);
          const parent = `${category.dataset}:${category.parentCatNo || ""}`;
          if (category.dataset === dataset && category.parentCatNo && out.has(parent) && !out.has(current)) {
            out.add(current);
            changed = true;
          }
        }
      }
      return out;
    }

    function readQuestionsState(){
      const fromParams = new URLSearchParams(location.search);
      const hasQueryState = ["search", "dataset", "status", "cat", "question"].some((key) => fromParams.has(key));
      if (hasQueryState) {
        return {
          search: fromParams.get("search") || "",
          dataset: fromParams.get("dataset") || "",
          status: fromParams.get("status") || "",
          categoryKey: fromParams.get("cat") || "",
          questionKey: fromParams.get("question") || "",
        };
      }
      try{
        return JSON.parse(sessionStorage.getItem(ADMIN_QUESTIONS_STATE_KEY) || "{}") || {};
      }catch(_){
        return {};
      }
    }

    function currentQuestionsState(){
      return {
        search: $("questionSearch").value || "",
        dataset: $("datasetFilter").value || "",
        status: $("statusFilter").value || "",
        categoryKey: $("categoryFilter").value || state.selectedCategoryKey || "",
        questionKey: state.selectedQuestionKey || "",
      };
    }

    function writeQuestionsState(){
      try{
        sessionStorage.setItem(ADMIN_QUESTIONS_STATE_KEY, JSON.stringify(currentQuestionsState()));
      }catch(_){}
    }

    function setSelectValue(id, value){
      const el = $(id);
      const safe = String(value || "");
      el.value = [...el.options].some((option) => option.value === safe) ? safe : "";
    }

    function applyQuestionsState(){
      const active = state.listStateApplied ? currentQuestionsState() : (state.pendingListState || {});
      $("questionSearch").value = active.search || "";
      setSelectValue("datasetFilter", active.dataset || "");
      setSelectValue("statusFilter", active.status || "");
      setSelectValue("categoryFilter", active.categoryKey || "");
      state.selectedCategoryKey = $("categoryFilter").value;
      if (active.questionKey) state.selectedQuestionKey = active.questionKey;
      state.listStateApplied = true;
    }

    function makeQuestionsUrl(overrides = {}){
      const current = { ...currentQuestionsState(), ...overrides };
      const q = new URLSearchParams();
      if (current.search) q.set("search", current.search);
      if (current.dataset) q.set("dataset", current.dataset);
      if (current.status) q.set("status", current.status);
      if (current.categoryKey) q.set("cat", current.categoryKey);
      if (current.questionKey) q.set("question", current.questionKey);
      const query = q.toString();
      return `./admin-questions.html${query ? `?${query}` : ""}`;
    }

    function makeQuizUrl(item){
      const q = new URLSearchParams({
        dataset: item.dataset,
        category: item.catNm,
        catNo: item.catNo,
        exam: item.questionNm,
        questionNo: item.questionNo,
        question: normalizePath(item.questionPdf),
        answer: normalizePath(item.answerPdf),
      });
      if (item.correctJson) q.set("correct", normalizePath(item.correctJson));
      if (item.questionCount) q.set("questionCount", item.questionCount);
      if (item.questionStartNo) q.set("questionStartNo", item.questionStartNo);
      if (item.questionEndNo) q.set("questionEndNo", item.questionEndNo);
      if (item.answerSourceId) q.set("answerSourceId", item.answerSourceId);
      return `./quiz.html?${q.toString()}`;
    }

    function makeAnchorEditQuizUrl(item){
      const url = makeQuizUrl(item);
      const [base, query = ""] = url.split("?");
      const q = new URLSearchParams(query);
      q.set("anchorDebug", "1");
      q.set("anchorEdit", "1");
      return `${base}?${q.toString()}`;
    }

    function makeAdminDetailUrl(item){
      const q = new URLSearchParams({
        dataset: item.dataset || "default",
        questionNo: item.questionNo || "",
      });
      q.set("return", makeQuestionsUrl({ questionKey: questionKey(item) }));
      return `./admin-detail.html?${q.toString()}`;
    }

    function filters(){
      return {
        text: $("questionSearch").value.trim().toLowerCase(),
        dataset: $("datasetFilter").value,
        status: $("statusFilter").value,
        categoryKey: $("categoryFilter").value || state.selectedCategoryKey,
      };
    }

    function matchesText(item, text){
      if (!text) return true;
      return [
        item.datasetLabel,
        item.gNm,
        item.catNm,
        item.fullName,
        item.categoryFullName,
        item.questionNm,
        item.questionPdf,
        item.answerPdf,
        item.correctJson,
        item.year,
        item.semester,
        item.examType,
      ].some((value) => String(value || "").toLowerCase().includes(text));
    }

    function matchesStatus(item, status){
      if (!status) return true;
      if (status === "published") return Boolean(item.published || item.published > 0);
      if (status === "unpublished") return Boolean(item.unpublished || !item.published);
      if (status === "warning") return rowNeedsAttention(item);
      if (status === "initial") return Boolean(item.workStateInitial) || (!item.correctJson && !item.anchorMap && !item.hasManualAnchorEdits);
      if (status === "anchor-missing") return !item.anchorMap;
      if (status === "manual-edited") return Boolean(item.hasManualAnchorEdits);
      if (status === "question-area-edited") return Boolean(item.hasManualQuestionAreaEdits);
      if (status === "derived-pdf") return Boolean(item.derivedPdf);
      return true;
    }

    function filteredQuestions(){
      const active = filters();
      const selectedKeys = categoryDescendantKeys(active.categoryKey);
      return state.catalog.questions.filter((item) => {
        if (active.dataset && item.dataset !== active.dataset) return false;
        if (selectedKeys.size && !selectedKeys.has(categoryKey(item))) return false;
        if (!matchesText(item, active.text)) return false;
        if (!matchesStatus(item, active.status)) return false;
        return true;
      });
    }

    function warningText(warnings){
      const list = Array.isArray(warnings) ? warnings.filter(Boolean) : [];
      return list.length ? list.slice(0, 3).map((item) => `- ${item}`).join("\n") : "특이사항 없음";
    }

    function hasNonNormalText(value){
      const text = String(value || "").trim();
      return Boolean(text && text !== "정상");
    }

    function rowNeedsAttention(item){
      const anchorWarnings = Array.isArray(item.anchorWarnings) && item.anchorWarnings.length > 0;
      const questionTone = item.questionDiagTone && item.questionDiagTone !== "ok";
      const answerTone = item.answerDiagTone && item.answerDiagTone !== "ok";
      return Boolean(
        hasNonNormalText(item.issue) ||
        hasNonNormalText(item.fileIssue) ||
        item.needsOcr ||
        hasNonNormalText(item.answerIssue) ||
        anchorWarnings ||
        questionTone ||
        answerTone
      );
    }

    function relativeTimeLabel(value){
      if (!value) return "";
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return "";
      const diffMs = Date.now() - date.getTime();
      const absMs = Math.abs(diffMs);
      const suffix = diffMs >= 0 ? "전" : "후";
      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;
      if (absMs < minute) return diffMs >= 0 ? "방금 전" : "곧";
      if (absMs < hour) return `${Math.max(1, Math.round(absMs / minute))}분 ${suffix}`;
      if (absMs < day) return `${Math.max(1, Math.round(absMs / hour))}시간 ${suffix}`;
      if (absMs < 30 * day) return `${Math.max(1, Math.round(absMs / day))}일 ${suffix}`;
      return `${Math.max(1, Math.round(absMs / (30 * day)))}개월 ${suffix}`;
    }

    function dateTimeLabel(value){
      if (!value) return "";
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function infoChip({ label, tone = "muted", title = "" }){
      return `<span class="infoChip ${escapeHtml(tone)}" title="${escapeHtml(title || label)}">${escapeHtml(label)}</span>`;
    }

    function infoChipGroup(label, chips){
      return `
        <div class="infoGroup">
          <span class="infoGroupLabel">${escapeHtml(label)}</span>
          <div class="chipRow">${chips.map(infoChip).join("")}</div>
        </div>
      `;
    }

    function statusWarningTitle(item){
      const notes = [];
      if (hasNonNormalText(item.issue)) notes.push(item.issue);
      if (hasNonNormalText(item.fileIssue)) notes.push(item.fileIssue);
      if (item.needsOcr) notes.push("OCR 확인 필요");
      if (hasNonNormalText(item.answerIssue)) notes.push(item.answerIssue);
      if (Array.isArray(item.questionDiagWarnings)) notes.push(...item.questionDiagWarnings);
      if (Array.isArray(item.answerDiagWarnings)) notes.push(...item.answerDiagWarnings);
      if (Array.isArray(item.anchorWarnings)) notes.push(...item.anchorWarnings);
      return notes.length ? notes.slice(0, 4).join("\n") : "확인 필요";
    }

    function questionTextDiagLabel(item){
      const status = String(item?.questionDiagStatus || "").trim();
      if (!status) return "미확인";
      if (status === "OCR") return "OCR 확인";
      if (status === "PDF") return "PDF 확인";
      return status;
    }

    function questionTextDiagOk(item){
      const status = String(item?.questionDiagStatus || "").trim();
      return !item?.needsOcr
        && (!status || status === "정상")
        && (!item?.questionDiagTone || item.questionDiagTone === "ok");
    }

    function percentLabel(value){
      const n = Number(value);
      return Number.isFinite(n) ? `${Math.max(0, Math.min(100, Math.round(n)))}%` : "-";
    }

    function pdfTextTone(item){
      const status = String(item?.textStatusLabel || questionTextDiagLabel(item) || "").trim();
      if (!status || status === "미확인") return "muted";
      return status === "정상" && !item?.needsOcr ? "ok" : "warn";
    }

    function pdfTextSummaryLabel(item){
      const status = item?.textStatusLabel || questionTextDiagLabel(item);
      const textChars = Number(item?.ocrTextChars || 0);
      if (!status || status === "미확인") return "미확인";
      if (!Number.isFinite(textChars) || textChars <= 0) return `${status} · 텍스트 0자`;
      return `${status} · 문제 ${percentLabel(item?.questionDetectRate)} · 선택지 ${percentLabel(item?.choiceDetectRate)}`;
    }

    function pdfTextExpectedChoiceCount(item){
      const direct = Number(item?.ocrExpectedChoiceCount || 0);
      if (direct > 0) return direct;
      const q = Number(item?.questionCount || item?.ocrExpectedQuestionCount || 0);
      const c = Number(item?.choiceCount || 4) || 4;
      return q > 0 ? q * c : 0;
    }

    function pdfTextDetailHtml(item){
      const warnings = Array.isArray(item?.questionDiagWarnings) && item.questionDiagWarnings.length
        ? item.questionDiagWarnings
        : (Array.isArray(item?.ocrWarnings) ? item.ocrWarnings : []);
      const expectedQuestion = Number(item?.ocrExpectedQuestionCount || item?.questionCount || 0);
      const expectedChoice = pdfTextExpectedChoiceCount(item);
      const reason = item?.textStatusReason || warnings.slice(0, 2).join(" / ") || "PDF 텍스트/구조 인식 기준 통과";
      return `
        <h3>PDF 텍스트 상세</h3>
        <div class="metricList">
          <div class="metricRow"><span>상태</span><strong>${escapeHtml(item?.textStatusLabel || questionTextDiagLabel(item))}</strong></div>
          <div class="metricRow"><span>텍스트 추출</span><strong>${Number(item?.ocrTextChars || 0).toLocaleString()}자</strong></div>
          <div class="metricRow"><span>페이지당 글자</span><strong>${Number(item?.ocrCharsPerPage || 0).toLocaleString()}자</strong></div>
          <div class="metricRow"><span>문제 인식</span><strong>${escapeHtml(percentLabel(item?.questionDetectRate))} · ${Number(item?.ocrUniqueQuestionLabels || 0).toLocaleString()}/${expectedQuestion || "-"}</strong></div>
          <div class="metricRow"><span>선택지 인식</span><strong>${escapeHtml(percentLabel(item?.choiceDetectRate))} · ${Number(item?.ocrChoiceLabels || 0).toLocaleString()}/${expectedChoice || "-"}</strong></div>
          <div class="metricRow"><span>OCR 변형</span><strong>${Number(item?.ocrChoiceVariantLabels || 0).toLocaleString()}개</strong></div>
          <div class="metricRow"><span>한글 분리</span><strong>${Number(item?.ocrBrokenHangulRuns || 0).toLocaleString()}개</strong></div>
        </div>
        ${warnings.length ? `<div><strong>경고</strong><ul>${warnings.map((warning) => `<li>${escapeHtml(warning)}</li>`).join("")}</ul></div>` : `<div class="note">OCR 위험 신호가 없습니다.</div>`}
        <div class="note">${escapeHtml(reason)}<br>정상은 OCR 100%가 아니라 PDF 텍스트/구조 인식 기준 통과입니다.</div>
      `;
    }

    function pdfTextStateItem(item){
      const label = pdfTextSummaryLabel(item);
      const tone = pdfTextTone(item);
      return `
        <div class="stateItem" title="${escapeHtml(`PDF 텍스트: ${label}`)}">
          <span>PDF 텍스트</span>
          <div class="pdfTextInline">
            <strong class="${escapeHtml(tone)}">${escapeHtml(label)}</strong>
            <button type="button" class="pdfTextMore" data-pdf-text-more="1" data-popover-html="${escapeHtml(pdfTextDetailHtml(item))}">더보기</button>
          </div>
        </div>
      `;
    }

    function attentionChipsForRow(item){
      const chips = [];
      const hasOcrIssue = Boolean(item.needsOcr || item.questionDiagStatus === "OCR");
      const answerIssue = String(item.answerIssue || "");
      if (hasNonNormalText(item.issue) && (!answerIssue || String(item.issue || "") !== answerIssue)) {
        chips.push({ label: item.issue, tone: item.issue.includes("없음") ? "danger" : "warn", title: item.issue });
      }
      if (hasNonNormalText(item.fileIssue)) {
        chips.push({ label: "파일 확인", tone: "warn", title: item.fileIssue });
      }
      if (hasOcrIssue) {
        chips.push({ label: "OCR 확인", tone: "warn", title: statusWarningTitle(item) });
      } else if (item.questionDiagTone && item.questionDiagTone !== "ok") {
        chips.push({ label: questionTextDiagLabel(item), tone: "warn", title: warningText(item.questionDiagWarnings) });
      }
      if (hasNonNormalText(item.answerIssue) || (item.answerDiagTone && item.answerDiagTone !== "ok")) {
        const label = item.answerIssue || item.answerDiagStatus || "정답 확인";
        chips.push({ label, tone: label.includes("없음") ? "danger" : "warn", title: warningText(item.answerDiagWarnings) });
      }
      if (Array.isArray(item.anchorWarnings) && item.anchorWarnings.length) {
        chips.push({ label: "위치맵 보정", tone: "warn", title: warningText(item.anchorWarnings) });
      }
      return chips;
    }

    function statusChipsForRow(item){
      const chips = attentionChipsForRow(item);
      if (matchesStatus(item, "initial")) chips.push({ label: "초기 상태", tone: "warn", title: "정답 JSON, 위치맵, 위치맵 수정 정보가 없는 초기 상태" });
      if (matchesStatus(item, "anchor-missing") && !questionTextDiagOk(item)) {
        chips.push({ label: "위치맵 생성 필요", tone: "warn", title: "PDF 텍스트/OCR 진단이 있어 저장 위치맵을 생성해 보정하는 것이 좋습니다." });
      }
      if (!chips.length) chips.push({ label: "정상", tone: "ok", title: "확인 필요한 운영 상태가 없습니다." });
      return chips;
    }

    function changeChipsForRow(item){
      const chips = [];
      if (item.anchorGeneratedAt) {
        chips.push({
          label: `위치맵 갱신 ${relativeTimeLabel(item.anchorGeneratedAt)}`,
          tone: "ok",
          title: `위치맵 생성/갱신: ${dateTimeLabel(item.anchorGeneratedAt)}`,
        });
      }
      if (item.anchorManualEditedAt || item.hasManualAnchorEdits) {
        chips.push({
          label: item.anchorManualEditedAt ? `위치맵 수정 ${relativeTimeLabel(item.anchorManualEditedAt)}` : "위치맵 수정",
          tone: "edit",
          title: item.anchorManualEditedAt ? `위치맵 수동 수정: ${dateTimeLabel(item.anchorManualEditedAt)}` : "저장 위치맵이 수동 수정되었습니다.",
        });
      }
      if (item.hasManualQuestionAreaEdits) {
        chips.push({
          label: "문항영역 수정",
          tone: "edit",
          title: "선택지 클릭 영역 또는 문항 영역이 수동 수정되었습니다.",
        });
      }
      if (item.derivedPdf) {
        chips.push({
          label: "OCR 사본",
          tone: "warn",
          title: normalizePath(item.derivedPdf),
        });
      }
      if (item.hasCorrectJson || item.correctJson) {
        chips.push({
          label: "정답 JSON 연결",
          tone: "ok",
          title: item.correctJson ? normalizePath(item.correctJson) : "정답 JSON 연결됨",
        });
      }
      if (!chips.length) chips.push({ label: "변경 없음", tone: "muted", title: "표시할 운영 변경 정보가 없습니다." });
      return chips;
    }

    function rowInfoSummary(item){
      return `
        <div class="infoSummary">
          ${infoChipGroup("상태", statusChipsForRow(item))}
          ${infoChipGroup("변경", changeChipsForRow(item))}
        </div>
      `;
    }

    function stateItem(label, value, tone = "ok", title = ""){
      return `
        <div class="stateItem" title="${escapeHtml(title || `${label}: ${value}`)}">
          <span>${escapeHtml(label)}</span>
          <strong class="${escapeHtml(tone)}">${escapeHtml(value || "-")}</strong>
        </div>
      `;
    }

    function structureItem(label, value, tone = "ok", title = ""){
      return `
        <div class="structureItem" title="${escapeHtml(title || `${label}: ${value}`)}">
          <span>${escapeHtml(label)}</span>
          <strong class="${escapeHtml(tone)}">${escapeHtml(value || "-")}</strong>
        </div>
      `;
    }

    function rowWorkState(item){
      const fallbackSteps = [
        item?.correctJson ? "정답JSON" : "",
        item?.anchorMap ? "위치맵" : "",
        item?.hasManualAnchorEdits ? "위치맵 수정" : "",
        item?.derivedPdf ? "OCR사본" : "",
      ].filter(Boolean);
      const label = item?.workState || (fallbackSteps.length ? fallbackSteps.join(" · ") : "초기");
      return {
        label,
        tone: item?.workStateTone || (label === "초기" ? "warn" : "ok"),
      };
    }

    function stateSummaryCell(item){
      const work = rowWorkState(item);
      const answerTone = item.answerDiagTone || (item.answerDiagStatus === "정상" ? "ok" : "warn");
      return `
        <div class="stateGrid">
          ${stateItem("게시", item.published ? "게시" : (item.issue || "미게시"), item.published ? "ok" : "warn")}
          ${stateItem("처리", work.label, work.tone)}
          ${pdfTextStateItem(item)}
          ${stateItem("정답", item.answerDiagStatus || "미확인", answerTone, warningText(item.answerDiagWarnings))}
        </div>
      `;
    }

    function questionRangeLabel(item){
      if (item.questionStartNo && item.questionEndNo) return `${item.questionStartNo}-${item.questionEndNo}`;
      if (item.questionCount) return `${item.questionCount}`;
      return "-";
    }

    function structureSummaryCell(item){
      const confidence = item.anchorMap ? `${Math.round(Number(item.anchorConfidence || 0) * 100)}%${item.hasManualAnchorEdits ? " · 수정" : ""}` : "미생성";
      const anchorTone = item.anchorMap
        ? ((Array.isArray(item.anchorWarnings) && item.anchorWarnings.length) || Number(item.anchorConfidence || 0) < .8 ? "warn" : (item.hasManualAnchorEdits ? "edit" : "ok"))
        : (questionTextDiagOk(item) ? "muted" : "warn");
      const anchorTitle = item.anchorMap
        ? `${item.anchorMap}${item.hasManualAnchorEdits ? "\n저장 위치맵에 수동 수정값이 있습니다." : ""}`
        : (questionTextDiagOk(item) ? "저장 위치맵은 없지만 PDF 텍스트 진단이 정상입니다." : "저장 위치맵이 없습니다.");
      return `
        <div class="structureGrid">
          ${structureItem("문항", item.questionCount ? `${item.questionCount}개` : "-", item.questionCount ? "ok" : "warn")}
          ${structureItem("범위", questionRangeLabel(item), item.questionStartNo && item.questionEndNo ? "ok" : "warn")}
          ${structureItem("위치맵", confidence, anchorTone, anchorTitle)}
          ${structureItem("문항영역", item.hasManualQuestionAreaEdits ? "수정" : "없음", item.hasManualQuestionAreaEdits ? "edit" : "muted", item.hasManualQuestionAreaEdits ? "문항/선택지 클릭 영역이 수동 수정되었습니다." : "문항영역 수동 수정이 없습니다.")}
        </div>
      `;
    }

    function renderQuestionCounts(rows){
      const warningCount = rows.filter((item) => matchesStatus(item, "warning")).length;
      const anchorMissing = rows.filter((item) => matchesStatus(item, "anchor-missing")).length;
      const manualEdited = rows.filter((item) => matchesStatus(item, "manual-edited")).length;
      const questionAreaEdited = rows.filter((item) => matchesStatus(item, "question-area-edited")).length;
      const derivedPdf = rows.filter((item) => matchesStatus(item, "derived-pdf")).length;
      const published = rows.filter((item) => item.published).length;
      $("questionCounts").innerHTML = [
        ["회차", rows.length],
        ["확인 필요", warningCount],
        ["위치맵 미생성", anchorMissing],
        ["위치맵 수정", manualEdited],
        ["문항영역 수정", questionAreaEdited],
        ["OCR 사본", derivedPdf],
        ["게시", published],
      ].map(([label, value]) => `
        <div class="countBox"><strong>${Number(value || 0).toLocaleString()}</strong><span>${escapeHtml(label)}</span></div>
      `).join("");
    }

    function renderFilters(){
      const active = state.listStateApplied ? currentQuestionsState() : (state.pendingListState || {});
      const datasets = [...new Map(state.catalog.categories.map((item) => [item.dataset, item.datasetLabel])).entries()];
      $("datasetFilter").innerHTML = `<option value="">전체 구분</option>${datasets.map(([value, label]) => `
        <option value="${escapeHtml(value)}">${escapeHtml(label)}</option>
      `).join("")}`;
      $("categoryFilter").innerHTML = `<option value="">전체 카테고리</option>${state.catalog.categories.map((item) => `
        <option value="${escapeHtml(categoryKey(item))}">${escapeHtml(item.fullName || item.catNm)} (${item.questionTotal})</option>
      `).join("")}`;
      $("questionSearch").value = active.search || "";
      setSelectValue("datasetFilter", active.dataset || "");
      setSelectValue("statusFilter", active.status || "");
      setSelectValue("categoryFilter", active.categoryKey || "");
      state.selectedCategoryKey = $("categoryFilter").value;
      if (active.questionKey) state.selectedQuestionKey = active.questionKey;
      state.listStateApplied = true;
    }

    function markSelectedQuestionRow(){
      document.querySelectorAll("#questionRows tr[data-question-key]").forEach((row) => {
        const selected = row.dataset.questionKey === state.selectedQuestionKey;
        row.classList.toggle("selected", selected);
        row.setAttribute("aria-selected", selected ? "true" : "false");
      });
    }

    function selectQuestionRow(key){
      if (!key) return;
      state.selectedQuestionKey = key;
      markSelectedQuestionRow();
      writeQuestionsState();
    }

    function renderQuestions(){
      const rows = filteredQuestions();
      renderQuestionCounts(rows);
      $("questionMeta").textContent = `전체 ${state.catalog.questions.length.toLocaleString()}개 중 ${rows.length.toLocaleString()}개`;
      if (!rows.length) {
        $("questionRows").innerHTML = `<tr><td class="empty" colspan="4">조건에 맞는 문제 회차가 없습니다.</td></tr>`;
        return;
      }
      if (!rows.some((item) => questionKey(item) === state.selectedQuestionKey)) {
        state.selectedQuestionKey = questionKey(rows[0]);
      }
      $("questionRows").innerHTML = rows.map((item) => {
        const key = questionKey(item);
        const selected = key === state.selectedQuestionKey;
        const questionFileName = fileNameFromPath(item.questionPdf) || item.questionNm || "-";
        const questionFolder = folderNameFromPath(item.questionPdf);
        const quizUrl = item.questionPdf ? makeQuizUrl(item) : "";
        const anchorDebugQuizUrl = quizUrl ? `${quizUrl}${quizUrl.includes("?") ? "&" : "?"}anchorDebug=1` : "";
        const anchorEditQuizUrl = quizUrl ? makeAnchorEditQuizUrl(item) : "";
        const detailUrl = makeAdminDetailUrl(item);
        const quizLink = quizUrl ? `<a class="button" href="${quizUrl}" target="_blank" rel="noopener">풀이</a>` : `<span class="button disabled">풀이</span>`;
        const positionLink = anchorDebugQuizUrl ? `<a class="button" href="${anchorDebugQuizUrl}" target="_blank" rel="noopener">위치확인</a>` : `<span class="button disabled">위치확인</span>`;
        const anchorEditLink = anchorEditQuizUrl ? `<a class="button secondary" href="${anchorEditQuizUrl}" target="_blank" rel="noopener">앵커편집</a>` : `<span class="button disabled">앵커편집</span>`;
        return `
          <tr class="selectableRow${selected ? " selected" : ""}" tabindex="0" data-question-key="${escapeHtml(key)}" data-detail-url="${escapeHtml(detailUrl)}" aria-selected="${selected ? "true" : "false"}">
            <td>
              <div class="questionTitleLine">
                <div class="cellTitle"><a href="${detailUrl}" target="_blank" rel="noopener">${escapeHtml(questionFileName)}</a></div>
                <span class="pill ${item.published ? "ok" : "warn"}">${item.published ? "게시" : "미게시"}</span>
              </div>
              <div class="cellSub">${escapeHtml(item.catNm)} · ${escapeHtml(item.datasetLabel)} · ${escapeHtml(item.gNm || "")}</div>
              <div class="pathCell">${escapeHtml(questionFolder)}</div>
              ${rowInfoSummary(item)}
            </td>
            <td>${stateSummaryCell(item)}</td>
            <td>${structureSummaryCell(item)}</td>
            <td>
              <div class="actionGrid">
                <a class="button primary" href="${detailUrl}" target="_blank" rel="noopener">상세</a>
                ${anchorEditLink}
                ${quizLink}
                ${positionLink}
              </div>
            </td>
          </tr>
        `;
      }).join("");
      markSelectedQuestionRow();
    }

    async function loadCatalog(){
      const data = await api("/api/admin/catalog");
      state.catalog = {
        categories: Array.isArray(data.categories) ? data.categories : [],
        questions: Array.isArray(data.questions) ? data.questions : [],
      };
      renderFilters();
      renderQuestions();
    }

    function setOffline(message){
      $("questionMeta").textContent = message;
      showToast(message, { title: "관리 서버 확인 필요", tone: "error" });
      document.querySelectorAll("button, input, select").forEach((el) => {
        if (el.id !== "btnRefresh") el.disabled = true;
      });
    }

    ["questionSearch", "datasetFilter", "statusFilter", "categoryFilter"].forEach((id) => {
      $(id).addEventListener("input", () => {
        if (id === "categoryFilter") state.selectedCategoryKey = $(id).value;
        renderQuestions();
        writeQuestionsState();
      });
      $(id).addEventListener("change", () => {
        if (id === "categoryFilter") state.selectedCategoryKey = $(id).value;
        renderQuestions();
        writeQuestionsState();
      });
    });

    $("questionRows").addEventListener("click", (event) => {
      const more = event.target.closest("[data-pdf-text-more]");
      if (more) {
        event.preventDefault();
        event.stopPropagation();
        showPdfTextPopover(more);
        return;
      }
      const row = event.target.closest("tr[data-question-key]");
      if (!row || event.target.closest("a, button")) return;
      selectQuestionRow(row.dataset.questionKey);
    });

    let activePdfTextPopover = null;

    function closePdfTextPopover(){
      if (activePdfTextPopover) activePdfTextPopover.remove();
      activePdfTextPopover = null;
    }

    function showPdfTextPopover(anchor){
      closePdfTextPopover();
      const popover = document.createElement("div");
      popover.className = "pdfTextPopover";
      popover.innerHTML = anchor.dataset.popoverHtml || "<h3>PDF 텍스트 상세</h3><div class=\"note\">PDF 진단 정보가 아직 없습니다.</div>";
      document.body.appendChild(popover);
      const rect = anchor.getBoundingClientRect();
      const popRect = popover.getBoundingClientRect();
      const left = Math.max(12, Math.min(window.innerWidth - popRect.width - 12, rect.right - popRect.width));
      const top = Math.max(12, Math.min(window.innerHeight - popRect.height - 12, rect.bottom + 8));
      popover.style.left = `${left}px`;
      popover.style.top = `${top}px`;
      activePdfTextPopover = popover;
    }

    document.addEventListener("click", (event) => {
      if (!activePdfTextPopover) return;
      if (event.target.closest(".pdfTextPopover") || event.target.closest("[data-pdf-text-more]")) return;
      closePdfTextPopover();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closePdfTextPopover();
    });

    $("questionRows").addEventListener("dblclick", (event) => {
      const row = event.target.closest("tr[data-question-key]");
      if (!row || event.target.closest("a, button")) return;
      selectQuestionRow(row.dataset.questionKey);
      const detailUrl = row.dataset.detailUrl;
      if (detailUrl) window.location.href = detailUrl;
    });

    $("questionRows").addEventListener("focusin", (event) => {
      const row = event.target.closest("tr[data-question-key]");
      if (row) selectQuestionRow(row.dataset.questionKey);
    });

    $("questionRows").addEventListener("keydown", (event) => {
      if (!["Enter", " "].includes(event.key)) return;
      const row = event.target.closest("tr[data-question-key]");
      if (!row || event.target.closest("a, button")) return;
      event.preventDefault();
      selectQuestionRow(row.dataset.questionKey);
    });

    $("btnClearFilter").addEventListener("click", () => {
      $("questionSearch").value = "";
      $("datasetFilter").value = "";
      $("statusFilter").value = "";
      $("categoryFilter").value = "";
      state.selectedCategoryKey = "";
      state.selectedQuestionKey = "";
      renderQuestions();
      writeQuestionsState();
    });

    $("btnRefresh").addEventListener("click", () => {
      loadCatalog().catch((err) => setOffline(err.message));
    });

    loadCatalog().catch((err) => setOffline(err.message));
  </script>
</body>
</html>
