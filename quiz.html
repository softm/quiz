<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>문제풀이 + 정답확인 (오답노트/단축키)</title>
  <style>
    :root{
      --header-h:58px;
      --bg-start:#f2f5fb; --bg:#e9eef7; --panel:#ffffff; --card:#f8faff; --text:#1e2633; --muted:#5c667a;
      --ok:#1f9f62; --bad:#d9365a; --line:rgba(24,38,61,.14); --btn:#dfe8ff; --btn2:#e9eef9; --warn:#f2b63b;
      --header-bg:rgba(233,238,247,.86); --viewer-bg:#eef3fb; --chip-bg:rgba(255,255,255,.75); --ghost-bg:rgba(255,255,255,.65);
      --stat-bg:rgba(248,250,255,.9); --sub-bg:rgba(245,248,255,.85); --choice-bg:rgba(255,255,255,.9); --note-bg:rgba(245,248,255,.88);
      --textarea-bg:#ffffff;
    }
    body.theme-dark{
      --bg-start:#070b16; --bg:#0b1020; --panel:#111a33; --card:#0f1730; --text:#e7ecff; --muted:#a9b4df;
      --ok:#27d17f; --bad:#ff4d6d; --line:rgba(255,255,255,.12); --btn:#22305a; --btn2:#1a2446; --warn:#ffbf3c;
      --header-bg:rgba(11,16,32,.9); --viewer-bg:#0a0f22; --chip-bg:rgba(15,23,48,.6); --ghost-bg:rgba(10,15,34,.35);
      --stat-bg:rgba(15,23,48,.7); --sub-bg:rgba(15,23,48,.55); --choice-bg:rgba(10,15,34,.55); --note-bg:rgba(15,23,48,.55);
      --textarea-bg:rgba(10,15,34,.55);
    }
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
      tap-highlight-color: transparent;
    }
    a, button, label, .choice, .qcard, .mobileDock button, .viewerNav, .bookmarkBtn{
      -webkit-tap-highlight-color: transparent;
      tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;
      background:linear-gradient(180deg,var(--bg-start), var(--bg)); color:var(--text);
    }
    header{
      padding:14px 16px; border-bottom:1px solid var(--line);
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      position:sticky; top:0; background:var(--header-bg); backdrop-filter:blur(10px); z-index:10;
    }
    header .left{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      padding-right:80px;
      min-width:0;
    }
    header .controls #btnTheme{
      position:absolute;
      top:10px;
      right:12px;
      z-index:12;
      margin:0;
    }
    header .controls #btnOrientation{
      position:absolute;
      top:10px;
      right:46px;
      z-index:12;
      margin:0;
    }
    header h1{
      font-size:16px;
      margin:0;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width:0;
      max-width:100%;
    }
    .pill{font-size:12px; padding:6px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted)}
    .wrap{display:grid; grid-template-columns: 1.25fr .75fr; gap:12px; padding:12px; min-height:calc(100dvh - var(--header-h))}
    .panel{
      background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
      display:flex;
      flex-direction:column;
    }
    .panel .title{
      padding:10px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
      gap:10px; flex-wrap:wrap;
    }
    .pdfTitleBar{
      padding-left:0;
      display:flex;
      flex-direction:column;
      align-items:stretch;
      gap:8px;
    }
    .pdfTitleBar > .currentQInfo{
      margin-left:0;
      border-top-left-radius:0;
      border-bottom-left-radius:0;
    }
    .pdfControlRow{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
    }
    .pdfLeadGroup{
      display:flex;
      align-items:center;
      gap:6px;
      min-width:0;
    }
    .pdfLeadGroup .bookmarkBtn,
    .pdfControlRow > .controls .bookmarkBtn{
      position:static;
      right:auto;
      top:auto;
      left:auto;
      bottom:auto;
      width:34px;
      height:34px;
      margin:0;
      flex:0 0 auto;
    }
    .pdfLeadGroup .bookmarkBtn svg,
    .pdfControlRow > .controls .bookmarkBtn svg{
      width:18px;
      height:18px;
    }
    .viewer > #btnBookmark{
      display:none !important;
    }
    .pdfControlRow > .controls{
      margin-left:auto;
      justify-content:flex-end;
    }
    .panel .title > .controls{
      margin-left:auto;
      justify-content:flex-end;
    }
    .panel .title > .controls .modeBtn{
      margin-left:auto;
    }
    .pdfTitleMeta{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:6px;
      min-width:0;
    }
    .panel .title strong{font-size:13px}
    .panel .title .mini{font-size:12px; color:var(--muted)}
    .currentQInfo{
      display:inline-flex;
      align-items:center;
      margin-left:0;
      padding:4px 10px;
      border:1px solid rgba(10,102,214,.45);
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      color:#0a66d6;
      background:rgba(10,102,214,.12);
      box-shadow:0 0 0 1px rgba(10,102,214,.08) inset;
    }
    body.theme-dark .currentQInfo{
      color:#79b6ff;
      border-color:rgba(121,182,255,.55);
      background:rgba(121,182,255,.16);
    }
    .answerKeyInfo{
      display:inline-flex;
      align-items:center;
      margin-left:0;
      padding:2px 8px;
      border:1px solid var(--line);
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      color:var(--muted);
      background:var(--chip-bg);
    }
    .answerKeyInfo.ready{
      color:#1a8f57;
      border-color:rgba(26,143,87,.45);
      background:rgba(26,143,87,.12);
    }
    .answerKeyInfo.fallback{
      color:#9a6a08;
      border-color:rgba(154,106,8,.45);
      background:rgba(242,182,59,.14);
    }
    .modeStateInfo{
      font-weight:800;
      transition:background .15s ease, color .15s ease, border-color .15s ease;
    }
    .modeStateInfo.mode-all{
      color:#42536f;
      border-color:rgba(66,83,111,.3);
      background:rgba(66,83,111,.08);
    }
    .modeStateInfo.mode-single{
      color:#0a66d6;
      border-color:rgba(10,102,214,.45);
      background:rgba(10,102,214,.14);
    }
    body.theme-dark .modeStateInfo.mode-all{
      color:#c2cbe6;
      border-color:rgba(194,203,230,.35);
      background:rgba(194,203,230,.14);
    }
    body.theme-dark .modeStateInfo.mode-single{
      color:#8bc0ff;
      border-color:rgba(139,192,255,.5);
      background:rgba(139,192,255,.18);
    }
    .viewer{
      height:auto;
      flex:1;
      min-height:0;
      background:var(--viewer-bg);
      overflow:auto;
      padding:10px 0;
      position:relative;
    }
    #pdfCanvas{
      display:block;
      width:100%;
      height:auto;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
    }
    #pdfAllPages{
      display:none;
    }
    #pdfAllPages .pdfPageCanvas{
      display:block;
      width:100%;
      height:auto;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      margin-bottom:10px;
    }
    .viewer:not(.single) #pdfAllPages{
      display:block;
    }
    .viewer:not(.single) #pdfCanvas{
      display:none;
    }
    .viewer.single #pdfCanvas{cursor:pointer}
    .viewerTopBadge{
      position:fixed !important;
      right:12px;
      bottom:14px;
      z-index:60;
      display:none;
      align-items:center;
      justify-content:center;
      min-width:48px;
      height:28px;
      padding:0 8px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.9);
      color:var(--text);
      font-size:10px;
      font-weight:800;
      box-shadow:0 4px 14px rgba(0,0,0,.14);
      cursor:pointer;
      white-space:nowrap;
      pointer-events:auto;
    }
    .viewerTopBadge.show{display:inline-flex}
    .viewerTopBadge.disabled{
      opacity:.45;
      filter:saturate(.7);
    }
    .toastStack{
      position:fixed;
      top:14px;
      right:14px;
      z-index:120;
      display:flex;
      flex-direction:column;
      gap:8px;
      pointer-events:none;
    }
    .toastMsg{
      min-width:220px;
      max-width:min(360px, calc(100vw - 28px));
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.96);
      color:var(--text);
      box-shadow:0 10px 24px rgba(0,0,0,.16);
      font-size:12px;
      font-weight:700;
      opacity:0;
      transform:translateY(-6px);
      transition:opacity .18s ease, transform .18s ease;
    }
    .toastMsg.show{
      opacity:1;
      transform:translateY(0);
    }
    .snackbar{
      position:fixed;
      left:50%;
      top:50%;
      z-index:119;
      transform:translate(-50%, calc(-50% + 10px));
      min-width:240px;
      max-width:min(420px, calc(100vw - 24px));
      padding:12px 14px;
      border-radius:999px;
      border:1px solid rgba(32,40,66,.08);
      background:rgba(52,64,92,.92);
      color:#f7f9ff;
      box-shadow:0 10px 28px rgba(0,0,0,.22);
      font-size:12px;
      font-weight:700;
      text-align:center;
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
    }
    .snackbar.show{
      opacity:1;
      transform:translate(-50%, -50%);
    }
    body.theme-dark .toastMsg{
      background:rgba(17,26,51,.96);
      border-color:rgba(255,255,255,.1);
      box-shadow:0 12px 28px rgba(0,0,0,.32);
    }
    body.theme-dark .snackbar{
      border-color:rgba(255,255,255,.1);
      background:rgba(244,247,255,.94);
      color:#233049;
      box-shadow:0 12px 30px rgba(0,0,0,.34);
    }
    body.theme-dark .viewerTopBadge{
      background:rgba(24,33,60,.9);
    }
    .pdfStatus{
      margin-top:8px;
      font-size:12px;
      color:var(--muted);
    }
    .pdfLoadingOverlay{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:5;
      background:rgba(255,255,255,.45);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
    }
    body.theme-dark .pdfLoadingOverlay{
      background:rgba(10,15,34,.45);
    }
    .pdfLoadingOverlay.show{display:flex}
    .pdfLoadingCard{
      min-width:180px;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .pdfSpinner{
      width:20px;
      height:20px;
      border-radius:50%;
      border:3px solid rgba(120,140,180,.25);
      border-top-color:#0a66d6;
      animation:spin .85s linear infinite;
      flex:0 0 auto;
    }
    .pdfLoadingText{
      font-size:12px;
      font-weight:700;
      color:var(--text);
      white-space:nowrap;
    }
    @keyframes spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }
    .pdfStatus button{
      margin-left:8px;
      padding:4px 8px;
      font-size:11px;
    }
    .viewerNav{
      position:absolute;
      bottom:12px;
      width:52px;
      height:120px;
      border:1px solid var(--line);
      border-radius:12px;
      background:rgba(255,255,255,.7);
      color:var(--text);
      font-size:20px;
      font-weight:800;
      display:none;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:3;
    }
    .viewerNav.left{left:6px}
    .viewerNav.right{right:6px}
    .viewer.single .viewerNav{display:flex}
    .viewer.single{
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }
    .bookmarkBtn{
      width:42px;
      height:42px;
      border:1px solid rgba(241,166,32,.5);
      border-radius:10px;
      background:rgba(255,255,255,.78);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:4;
      padding:0;
    }
    .viewer.single .bookmarkBtn{
      position:absolute;
      right:10px;
      top:10px;
    }
    .viewer:not(.single) .bookmarkBtn{
      position:sticky;
      top:10px;
      left:calc(100% - 52px);
    }
    .bookmarkBtn svg{
      width:22px;
      height:22px;
      stroke:#f1a620;
      stroke-width:2.1;
      fill:none;
    }
    .bookmarkBtn.active svg{fill:#f1a620}
    .controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
    .iconBtn{
      width:34px;
      height:34px;
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:800;
    }
    .themeIcon{
      font-size:16px;
      line-height:1;
    }
    #btnTheme{
      width:30px;
      height:30px;
      font-size:12px;
      padding:0 !important;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height:1;
    }
    #btnOrientation{
      width:30px;
      height:30px;
      font-size:13px;
      padding:0 !important;
      display:none;
      align-items:center;
      justify-content:center;
      line-height:1;
      font-weight:800;
    }
    #btnTheme .themeIcon{
      font-size:14px;
      display:inline-block;
      line-height:1;
      margin:0;
    }
    button{
      background:var(--btn); color:var(--text); border:1px solid var(--line);
      padding:8px 10px; border-radius:10px; cursor:pointer; font-weight:600; font-size:12px;
    }
    button.secondary{background:var(--btn2)}
    button.ghost{background:var(--ghost-bg)}
    button.danger{background:rgba(255,77,109,.12); border-color:rgba(255,77,109,.35)}
    button.warn{background:rgba(255,191,60,.12); border-color:rgba(255,191,60,.35)}
    button:hover{filter:brightness(1.08)}
    button.active{outline:2px solid rgba(169,180,223,.6)}
    .modeBtn{
      font-size:14px;
      font-weight:800;
      padding:8px 12px;
      letter-spacing:-0.01em;
    }
    label.toggle{
      display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted);
      padding:6px 10px; border:1px solid var(--line); border-radius:999px;
      background:var(--chip-bg);
    }
    input[type="checkbox"]{transform:scale(1.05)}
    .sheet{
      padding:10px 10px 14px;
      height:auto;
      flex:1;
      min-height:0;
      overflow:auto;
    }

    @media (min-width: 769px){
      body{height:100dvh; overflow:hidden}
      .wrap{
        height:calc(100dvh - var(--header-h));
        min-height:0;
      }
      .panel{min-height:0}
    }

    .stats{display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-bottom:10px;}
    .stat{background:var(--stat-bg); border:1px solid var(--line); border-radius:12px; padding:10px;}
    .stat .k{font-size:12px; color:var(--muted)}
    .stat .v{font-size:18px; font-weight:800; margin-top:4px}

    .subStats{display:grid; grid-template-columns: repeat(4,1fr); gap:8px; margin:10px 0 10px;}
    .sub{background:var(--sub-bg); border:1px solid var(--line); border-radius:12px; padding:10px;}
    .sub .k{font-size:12px; color:var(--muted)}
    .sub .v{font-size:14px; font-weight:800; margin-top:4px}

    .filterBar{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 10px;}
    .filterBar button:disabled{
      opacity:.45;
      cursor:not-allowed;
      filter:saturate(.75);
    }
    .sheetTitleBar{
      padding:6px 10px;
      min-height:38px;
      display:flex;
      align-items:center;
    }
    .sheetTitleBar strong{
      font-size:13px;
      font-weight:800;
    }
    .sheetControlBar{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:8px;
    }
    .sheetControlBar .filterBar{
      margin:0;
      min-width:0;
    }
    .sheetControlBar .controls{
      margin-left:auto;
      display:flex;
      flex-wrap:nowrap;
      gap:8px;
    }
    body.info-collapsed .sheet .stats,
    body.info-collapsed .sheet .subStats{
      display:none;
    }

    .grid{display:grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap:8px;}
    .qcard{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:12px;
      padding:8px 8px 6px;
    }
    .qcard.hidden{display:none}
    .qcard.focus{outline:2px solid rgba(169,180,223,.75)}
    .qcard.locked{opacity:.72}
    .qhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
    .qnum{font-weight:800; font-size:12px}
    .qmeta{display:flex; align-items:center; gap:4px}
    .qbm{
      display:none;
      width:16px;
      height:16px;
      border-radius:6px;
      font-size:11px;
      line-height:1;
      align-items:center;
      justify-content:center;
      color:#fff;
      background:#f1a620;
    }
    .qcard.bookmarked .qbm{display:flex}
    .mark{
      font-size:11px; font-weight:800;
      padding:2px 6px; border-radius:999px;
      border:1px solid var(--line); color:var(--muted);
      user-select:none;
    }
    .mark.ok{color:var(--ok); border-color:rgba(39,209,127,.5); background:rgba(39,209,127,.08)}
    .mark.bad{color:var(--bad); border-color:rgba(255,77,109,.5); background:rgba(255,77,109,.08)}
    .mark.lock{color:var(--warn); border-color:rgba(255,191,60,.45); background:rgba(255,191,60,.08)}
    .mark.blank{
      font-size:0;
      line-height:1;
      min-width:24px;
      text-align:center;
      padding:2px 4px;
      border-color:rgba(120,140,180,.35);
      background:rgba(120,140,180,.08);
    }
    .mark.blank::before{
      content:"●";
      font-size:10px;
      color:#6c7a99;
      font-weight:800;
    }
    .choices{display:grid; grid-template-columns: repeat(4, 1fr); gap:6px;}
    .choice{
      display:flex; align-items:center; justify-content:center;
      border:1px solid var(--line); border-radius:10px;
      padding:6px 0; font-size:12px; color:var(--text);
      background:var(--choice-bg);
      cursor:pointer;
      user-select:none;
    }
    .choice input{display:none}
    .choice.selected{
      outline:2px solid rgba(10,102,214,.85);
      border-color:rgba(10,102,214,.72);
      background:rgba(10,102,214,.05);
      box-shadow:0 0 0 1px rgba(10,102,214,.2) inset, 0 1px 4px rgba(10,102,214,.22);
      font-weight:800;
    }
    .choice:active{
      background:var(--choice-bg) !important;
    }
    .choice.selected:active{
      background:rgba(10,102,214,.05) !important;
    }
    .qcard:active{
      background:var(--card) !important;
    }
    .choice.correct{outline:2px solid rgba(39,209,127,.8)}
    .choice.wrong{outline:2px solid rgba(255,77,109,.85)}
    .choice.disabled{cursor:not-allowed; filter:grayscale(.2);}

    .footerNote{
      margin-top:10px; font-size:12px; color:var(--muted); line-height:1.45;
      border-top:1px solid var(--line); padding-top:10px;
    }
    .tiny{font-size:11px; color:var(--muted)}
    #saveHint,
    #modeHint{
      display:none !important;
    }

    .notePanel{
      margin-top:10px;
      background:var(--note-bg);
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
    }
    .adWrap{
      margin-top:10px;
      min-height:100px;
      border:1px dashed var(--line);
      border-radius:12px;
      background:var(--note-bg);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:12px;
      padding:8px;
    }
    .mobileDock{
      display:none;
    }
    .landscapeDockMount{
      display:none;
    }
    .sheetOverlay{
      display:none;
    }
    .notePanel .head{
      display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
      margin-bottom:8px;
    }
    textarea{
      width:100%;
      min-height:140px;
      resize:vertical;
      background:var(--textarea-bg);
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px;
      color:var(--text);
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:12px;
      line-height:1.45;
    }

  const DEFAULT_ANSWER_PDF_URL = "./최종정답.pdf";
  const params = new URLSearchParams(window.location.search);
  const DATASET = params.get("dataset") === "knou" ? "knou" : "default"; // SOFTM-KNOU: 기존/방통대 데이터셋 구분 추가 - 2026-05-29

  const EXAM_NAME = params.get("exam") || "기본 회차";

  let stickyOffsetsRaf = 0;
  function queueStickyOffsetsUpdate(frameCount = 2){
    if (stickyOffsetsRaf) cancelAnimationFrame(stickyOffsetsRaf);
    const remaining = Math.max(1, Math.floor(frameCount));
    const tick = (left) => {
      updateStickyOffsets();
      if (left <= 1) {
        stickyOffsetsRaf = 0;
        return;
      }
      stickyOffsetsRaf = requestAnimationFrame(() => tick(left - 1));
    };
    stickyOffsetsRaf = requestAnimationFrame(() => tick(remaining));
  }

        const mobileSaved = Number(ui.pdfZoomMobile);

  function resetPdfZoom(){

  function enforceMobileReadingMode(){
    if (!isMobileViewport()) {
      const desktopZoom = Math.max(0.7, Math.min(1.8, Number(state.pdfZoomDesktop) || 1));
      if (Math.abs((state.pdfZoom || 0) - desktopZoom) > 0.001) {
        state.pdfZoom = desktopZoom;
        state.allPagesRenderKey = null;
        state.allPageCanvases = [];
        updateViewModeUi();
        updateZoomButtons();
        saveUi();
      }
      return;
    }
    const minZoom = getDefaultPdfZoomForViewport();
    let changed = false;
    if (state.pdfZoom < minZoom) {
      state.pdfZoom = minZoom;
      changed = true;
    }
    if (changed) {
      state.pdfZoomMobile = state.pdfZoom;
      state.allPagesRenderKey = null;
      state.allPageCanvases = [];
      updateViewModeUi();
      updateZoomButtons();
      saveUi();
    }

    if (isMobileViewport()) state.pdfZoomMobile = next;
    else state.pdfZoomDesktop = next;
    state.allPagesRenderKey = null;

  /* SOFTM-GEN 시작: 디렉토리별 correct.json에서 현재 회차 정답 로딩 - 2026-05-29 */
  function buildLocalJsonCandidates(pathValue){
    const rawPath = String(pathValue || "").split("#")[0].split("?")[0].trim();
    const decodedPath = (() => {
      try { return decodeURIComponent(rawPath); } catch(_) { return rawPath; }
    })();
    const normalizedPath = decodedPath.replace(/^\.\//, "").replace(/^quiz\//, "");
    const candidates = [];
    for (const raw of [normalizedPath, normalizedPath.normalize("NFC"), normalizedPath.normalize("NFD")]){
      const rel = raw.replace(/^\.\//, "");
      if (!rel) continue;
      const encoded = `./${encodeURI(rel)}`;
      const plain = `./${rel}`;
      if (!candidates.includes(encoded)) candidates.push(encoded);
      if (!candidates.includes(plain)) candidates.push(plain);
    }
    return candidates;
  }

  function pickCorrectJsonItem(data){
    if (Array.isArray(data?.answers)) return data;
    const items = Array.isArray(data?.items) ? data.items : (Array.isArray(data) ? data : []);
    if (!items.length) return null;
    const byNo = QUESTION_NO ? items.find((row) => String(row?.questionNo || "") === String(QUESTION_NO)) : null;
    if (byNo) return byNo;
    const targetPdf = normalizePdfPathInput(QUESTION_PDF_URL).normalize("NFC");
    const byPdf = items.find((row) => normalizePdfPathInput(row?.questionPdf || "").normalize("NFC") === targetPdf);
    if (byPdf) return byPdf;
    const normalizedExam = normalizeExamKey(EXAM_NAME);
    return items.find((row) => normalizeExamKey(row?.questionNm || "") === normalizedExam) || null;
  }

  function knownAnswerCount(values){
    return (values || []).filter((v) => isKnownAnswerValue(normalizeAnswerValue(v))).length;
  }

  function normalizeAnswerStartNo(meta = {}){
    const candidates = [
      meta.answerStartNo,
      meta.questionStartNo,
      state.answerStartNo,
      QUESTION_START_NO,
      state.pdfNav?.questionStartNo,
      1
    ];
    for (const value of candidates){
      const n = Number(value);
      if (Number.isInteger(n) && n > 0) return n;
    }
    return 1;
  }

  function buildAnswerKeyArray(source, meta = {}){
    if (!Array.isArray(source)) return null;
    const dyn = Array(QUESTION_COUNT + 1).fill(null);
    const answerStartNo = normalizeAnswerStartNo(meta);
    const localZero = Array.from({ length: QUESTION_COUNT }, (_, idx) => source[idx]);
    const localOne = Array.from({ length: QUESTION_COUNT }, (_, idx) => source[idx + 1]);
    const printedZero = Array.from({ length: QUESTION_COUNT }, (_, idx) => source[answerStartNo + idx - 1]);
    const printedOne = Array.from({ length: QUESTION_COUNT }, (_, idx) => source[answerStartNo + idx]);
    const candidates = [
      { mode: "local-zero", values: localZero, bias: source.length === QUESTION_COUNT ? 0.25 : 0 },
      { mode: "local-one", values: localOne, bias: source.length >= QUESTION_COUNT + 1 && source[0] == null ? 0.18 : 0 },
      { mode: "printed-zero", values: printedZero, bias: answerStartNo > 1 ? 0.12 : 0 },
      { mode: "printed-one", values: printedOne, bias: answerStartNo > 1 && source[0] == null ? 0.08 : 0 }
    ];
    const picked = candidates
      .map((row) => ({ ...row, count: knownAnswerCount(row.values), score: knownAnswerCount(row.values) + row.bias }))
      .sort((a, b) => b.score - a.score)[0];
    if (!picked || picked.count <= 0) return null;
    for (let q = 1; q <= QUESTION_COUNT; q++){
      dyn[q] = normalizeAnswerValue(picked.values[q - 1]);
    }
    return {
      dyn,
      count: picked.count,
      answerStartNo,
      answerEndNo: Number(meta.answerEndNo || meta.questionEndNo || (answerStartNo + QUESTION_COUNT - 1)),
      mode: meta.answerIndexMode || picked.mode,
    };
  }

  function applyAnswerKeyResult(result){
    if (!result || !Array.isArray(result.dyn)) {
      state.answerKeyDynamic = null;
      state.answerKeyStatus = "unavailable";
      state.answerStartNo = null;
      state.answerEndNo = null;
      return false;
    }
    state.answerKeyDynamic = result.dyn;
    state.answerStartNo = result.answerStartNo || null;
    state.answerEndNo = result.answerEndNo || null;
    state.answerKeyStatus = result.count >= QUESTION_COUNT ? "ready" : (result.count > 0 ? "partial" : "unavailable");
    return result.count > 0;
  }

  async function loadAnswerKeyFromCorrectJson(){
    if (!CORRECT_JSON_URL) return false;
    state.answerKeySource = "json";
    for (const candidate of buildLocalJsonCandidates(CORRECT_JSON_URL)){
      try{
        const res = await fetch(candidate, { cache: "no-store" });
        if (!res.ok) continue;
        const data = await res.json();
        const picked = pickCorrectJsonItem(data);
        const source = Array.isArray(picked?.answers) ? picked.answers : null;
        if (!source) continue;
        const result = buildAnswerKeyArray(source, picked);
        if (!result) continue;
        return applyAnswerKeyResult(result);
      }catch(_){}
    }
    return false;
  }

      if (!normalizedPdfPath || !/\.pdf$/i.test(normalizedPdfPath)) {

      const jsonRelPath = normalizedPdfPath.replace(/\.pdf$/i, ".json");

        if (!candidates.includes(encoded)) candidates.push(encoded);

      let res = null;

        try{

      const data = await res.json();

  function getSingleCropOverrideByPdfUrl(){

  async function fetchPdfCandidateWithTimeout(url, options = {}, timeoutMs = 2500){
    const hasAbort = typeof AbortController !== "undefined";
    const controller = hasAbort ? new AbortController() : null;
    let timer = null;
    try{
      const request = fetch(url, controller ? { ...options, signal: controller.signal } : options);
      const timeout = new Promise((_, reject) => {
        timer = window.setTimeout(() => {
          try{ controller?.abort(); }catch(_){}
          reject(new Error("PDF 후보 경로 확인 시간 초과"));
        }, timeoutMs);
      });
      return await Promise.race([request, timeout]);
    } finally {
      if (timer) window.clearTimeout(timer);
    }
  }
  // SOFTM-위치맵: AbortController가 없는 환경에서도 PDF 후보 경로 확인이 멈추지 않도록 Promise 타임아웃 적용 - 2026-05-30

  async function resolveExistingPdfUrl(pathValue, kind){
    const baseRaw = normalizePdfPathInput(String(pathValue || "").split("#")[0].split("?")[0]);
    const localPdfPath = baseRaw.replace(/^quiz\//, "");
    if (/^pdf\//.test(localPdfPath)) return localPdfPath;
    // SOFTM-위치맵: 로컬 pdf 경로는 정규화 후보 탐색 전에 바로 사용해 경로 확인 단계 지연을 방지 - 2026-05-30
    const decodedRaw = tryDecodeURIComponent(baseRaw);
    const decodedTwice = tryDecodeURIComponent(decodedRaw);
    const candidates = [];
    const pushCandidate = (raw) => {
      const safe = String(raw || "").trim();
      if (!safe) return;
      const encoded = encodeURI(safe);
      if (!candidates.includes(encoded)) candidates.push(encoded);
      if (!candidates.includes(safe)) candidates.push(safe);
    };
    for (const raw of [
      baseRaw,
      decodedRaw,
      decodedTwice,
      decodedRaw.normalize("NFC"),
      decodedRaw.normalize("NFD"),
      decodedTwice.normalize("NFC"),
      decodedTwice.normalize("NFD"),
      baseRaw.normalize("NFC"),
      baseRaw.normalize("NFD")
    ]) pushCandidate(raw);

    for (const c of candidates){
      try{
        const res = await fetchPdfCandidateWithTimeout(c, { method: "HEAD", cache: "no-store" });
        if (res.ok) return c;
      }catch(_){}
    }
    for (const c of candidates){
      try{
        const res = await fetchPdfCandidateWithTimeout(c, { cache: "no-store" });
        if (res.ok) return c;
      }catch(_){}
    }
    const manifestPath = await findPdfPathFromManifest(kind || "question");
    if (manifestPath) {
      const manifestCandidates = [
        manifestPath,
        manifestPath.normalize("NFC"),
        manifestPath.normalize("NFD"),
        encodeURI(manifestPath),
        encodeURI(manifestPath.normalize("NFC")),
        encodeURI(manifestPath.normalize("NFD"))
      ];
      for (const c of manifestCandidates){
        try{
          const res = await fetchPdfCandidateWithTimeout(c, { cache: "no-store" });
          if (res.ok) return c;
        }catch(_){}
      }
      if (manifestCandidates[0]) return manifestCandidates[0];
    }
    return candidates[0] || baseRaw;
  }

    if (!loadedAnswerKey && /\.pdf(?:$|[?#])/i.test(String(ANSWER_PDF_URL || ""))) {
      await buildDynamicAnswerKeyFromPdf({ silent: true });
    }
  }

  function getPdfPageByQuestion(q){
    const nav = state.pdfNav;
    if (nav.mode === "auto" && Array.isArray(nav.questionPageMap) && Number.isFinite(nav.questionPageMap[q])) {
      return Math.max(1, Math.floor(nav.questionPageMap[q]));
    }
    // 자동 매핑 전 임시 기본값: PDF 총 페이지 수를 기준으로 균등 분배
    if (state.pdfDoc && Number.isFinite(state.pdfDoc.numPages) && state.pdfDoc.numPages > 0) {
      const qPerPage = QUESTION_COUNT / state.pdfDoc.numPages;
      const page = 1 + Math.floor((q - 1) / Math.max(1, qPerPage));
      return Math.min(state.pdfDoc.numPages, Math.max(1, page));
    }
    return 1;
  }

  function buildMapFromAnchors(anchorList){
    const pageMap = Array(QUESTION_COUNT + 1).fill(1);
    const ratioMap = Array(QUESTION_COUNT + 1).fill(0.12);
    if (!Array.isArray(anchorList) || anchorList.length === 0) {
      return { pageMap, ratioMap };
    }

    for (let i = 0; i < anchorList.length; i++){
      const pageNo = i + 1;
      const startQ = anchorList[i];
      const nextStart = anchorList[i + 1] || (QUESTION_COUNT + 1);
      const endQ = Math.min(QUESTION_COUNT, nextStart - 1);
      const count = Math.max(1, endQ - startQ + 1);

      for (let q = startQ; q <= endQ; q++){
        pageMap[q] = pageNo;
        const idx = q - startQ;
        ratioMap[q] = Math.max(0.08, Math.min(0.9, 0.12 + (idx / count) * 0.74));
      }
    }

    for (let q = 2; q <= QUESTION_COUNT; q++){
      pageMap[q] = Math.max(pageMap[q], pageMap[q - 1]);
    }
    return { pageMap, ratioMap };
  }

  /* SOFTM-패턴 시작: PDF 텍스트 레이어 기반 실시간 문제지 패턴 분석 공통화 - 2026-05-29 */
  function getPdfPatternCacheKey(){
    const rangeKey = `${QUESTION_START_NO || "auto"}-${QUESTION_END_NO || "auto"}`;
    return `${getCurrentPdfSourceKey()}|map:${PDF_MAP_VERSION}|pattern:${PDF_PATTERN_VERSION}|q:${QUESTION_COUNT}|c:${CHOICE_COUNT}|r:${rangeKey}`;
  }

  function readPdfPatternCache(){
    try{
      const raw = localStorage.getItem(STORAGE_PDF_PATTERN_KEY);
      const store = raw ? JSON.parse(raw) : {};
      const entry = store[getPdfPatternCacheKey()];
      return isUsablePdfPatternResult(entry, { allowLowConfidence: true }) ? entry : null;
    }catch(_){
      return null;
    }
  }

  function writePdfPatternCache(pattern){
    if (!isUsablePdfPatternResult(pattern, { allowLowConfidence: true })) return;
    try{
      const raw = localStorage.getItem(STORAGE_PDF_PATTERN_KEY);
      const store = raw ? JSON.parse(raw) : {};
      store[getPdfPatternCacheKey()] = pattern;
      const keys = Object.keys(store).sort((a, b) => String(store[b]?.generatedAt || "").localeCompare(String(store[a]?.generatedAt || "")));
      for (const key of keys.slice(10)) delete store[key];
      localStorage.setItem(STORAGE_PDF_PATTERN_KEY, JSON.stringify(store));
    }catch(_){}
  }

  function isUsablePdfPatternResult(pattern, options = {}){
    if (!pattern || typeof pattern !== "object") return false;
    if (pattern.version !== PDF_PATTERN_VERSION) return false;
    if (String(pattern.source || "") !== getCurrentPdfSourceKey()) return false;
    if (Number(pattern.questionCount) !== QUESTION_COUNT) return false;
    const configured = getConfiguredQuestionRange();
    if (configured && Number(pattern.questionStartNo) !== configured.start) return false;
    if (!Array.isArray(pattern.questionPageMap) || !Array.isArray(pattern.questionTopRatioMap)) return false;
    if (pattern.questionPageMap.length < QUESTION_COUNT + 1 || pattern.questionTopRatioMap.length < QUESTION_COUNT + 1) return false;
    const confidence = Number(pattern.confidence);
    const minConfidence = options.allowLowConfidence ? 0.18 : 0.32;
    return Number.isFinite(confidence) && confidence >= minConfidence;
  }

  function clearPdfAnalysisCaches(){

  function isSamePdfPatternArray(current, next, tolerance = 0){
    if (!Array.isArray(current) || !Array.isArray(next)) return false;
    if (current.length < QUESTION_COUNT + 1 || next.length < QUESTION_COUNT + 1) return false;
    for (let q = 1; q <= QUESTION_COUNT; q++){
      const a = Number(current[q]);
      const b = Number(next[q]);
      if (!Number.isFinite(a) || !Number.isFinite(b)) return false;
      if (Math.abs(a - b) > tolerance) return false;
    }
    return true;
  }

  function shouldRefreshFromAnchorPattern(anchorPattern){

    const currentGeneratedAt = String(state.pdfNav.generatedAt || "");
    const nextGeneratedAt = String(anchorPattern.generatedAt || "");
    if (currentGeneratedAt && nextGeneratedAt && currentGeneratedAt !== nextGeneratedAt) return true;
    if (!isSamePdfPatternArray(state.pdfNav.questionPageMap, anchorPattern.questionPageMap)) return true;

  function makeRowsFromTextLayer(layer, yTolerance = 2.2){
    const rows = [];
    const pageW = Math.max(1, Number(layer?.pageW) || 1);
    const pageH = Math.max(1, Number(layer?.pageH) || 1);
    for (const item of (layer?.items || [])){
      const s = String(item?.str || "").trim();
      if (!s) continue;
      const x = Number(item.transform && item.transform[4]);
      const y = Number(item.transform && item.transform[5]);
      if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
      let row = null;
      for (const candidate of rows){
        if (Math.abs(candidate.y - y) <= yTolerance) { row = candidate; break; }
      }
      if (!row) {
        row = { y, parts: [] };
        rows.push(row);
      }
      row.parts.push({ x, s, h: Math.max(8, Math.abs(Number(item.height) || 0)) });
    }
    for (const row of rows){
      row.parts.sort((a, b) => a.x - b.x);
      row.line = row.parts.map((p) => p.s).join(" ").replace(/\s+/g, " ").trim();
      row.xRatio = Math.max(0, Math.min(1, (row.parts[0]?.x || 0) / pageW));
      const h = Math.max(8, row.parts.reduce((max, p) => Math.max(max, Number(p.h) || 0), 0));
      row.yRatio = Math.max(0, Math.min(1, (pageH - row.y - h) / pageH));
    }
    rows.sort((a, b) => a.yRatio - b.yRatio || a.xRatio - b.xRatio);
    return { rows, pageW, pageH };
  }

  async function getQuestionPageRows(pageNo, yTolerance = 2.2){
    const key = `${pageNo}:${yTolerance}`;
    if (state.pageTextRowsCache[key]) return state.pageTextRowsCache[key];
    const layer = await getQuestionPageTextLayer(pageNo);
    const rowInfo = makeRowsFromTextLayer(layer, yTolerance);
    state.pageTextRowsCache[key] = rowInfo;
    return rowInfo;
  }

  function normalizePatternLine(value){
    return String(value || "")
      .normalize("NFC")
      .replace(/[0-9]+/g, "#")
      .replace(/\s+/g, " ")
      .trim();
  }

  function parseQuestionRangeFromLine(value){
    const text = String(value || "").normalize("NFC");
    const m = text.match(/(\d{1,3})\s*[～~\-]\s*(\d{1,3})\s*번/);
    if (!m) return null;
    const start = Number(m[1]);
    const end = Number(m[2]);
    if (!Number.isFinite(start) || !Number.isFinite(end) || start < 1 || end < start) return null;
    return { start, end };
  }

  function detectQuestionRangeFromRows(rows){
    for (const row of (rows || [])){
      const range = parseQuestionRangeFromLine(row.line);
      if (range) return range;
    }
    return null;
  }

  function parseQuestionLabelFromLineStart(lineText){
    const t = String(lineText || "").trim();
    if (!t) return null;
    let m = t.match(/^\(?\s*(\d{1,3})\s*(?:번|[.])(?:\s+|$)/);
    if (m) return Number(m[1]);
    m = t.match(/^제\s*(\d{1,3})\s*문\s*/);
    if (m) return Number(m[1]);
    m = t.match(/^문(?:항|제)?\s*(\d{1,3})\s*/);
    if (m) return Number(m[1]);
    return null;
  }

  function inferQuestionRangeFromPattern(rawAnchors, detectedRanges){
    const configured = getConfiguredQuestionRange();
    if (configured) return configured;
    const exactRange = (detectedRanges || []).find((range) => range && (range.end - range.start + 1) === QUESTION_COUNT);
    if (exactRange) return { ...exactRange, source: "header" };
    const usableRange = (detectedRanges || []).find((range) => range && (range.end - range.start + 1) > 0);
    if (usableRange) return { start: usableRange.start, end: usableRange.start + QUESTION_COUNT - 1, source: "header" };
    const labels = [...new Set((rawAnchors || []).map((a) => Number(a.label)).filter((n) => Number.isFinite(n) && n >= 1))].sort((a, b) => a - b);
    if (!labels.length) return { start: 1, end: QUESTION_COUNT, source: "default" };
    const min = labels[0];
    const max = labels[labels.length - 1];
    if (min > 1 || max > QUESTION_COUNT || (max - min + 1) === QUESTION_COUNT) {
      return { start: min, end: min + QUESTION_COUNT - 1, source: "labels" };
    }
    return { start: 1, end: QUESTION_COUNT, source: "labels" };
  }

  function detectPageBandsFromRows(rows){
    const visibleRows = (rows || []).filter((row) => String(row.line || "").trim());
    const bottomRows = visibleRows.filter((row) => row.yRatio >= 0.86 && !parseQuestionLabelFromLineStart(row.line));
    const topRows = visibleRows.filter((row) => row.yRatio <= 0.06 && !parseQuestionLabelFromLineStart(row.line));
    const footerStart = bottomRows.length ? Math.max(0.78, Math.min(...bottomRows.map((row) => row.yRatio)) - 0.006) : null;
    const headerEnd = topRows.length ? Math.min(0.12, Math.max(...topRows.map((row) => row.yRatio)) + 0.025) : null;
    const contentRows = visibleRows.filter((row) =>
      (!Number.isFinite(headerEnd) || row.yRatio > headerEnd) &&
      (!Number.isFinite(footerStart) || row.yRatio < footerStart)
    );
    const contentStart = contentRows.length ? Math.max(0, Math.min(...contentRows.map((row) => row.yRatio)) - 0.01) : 0;
    const contentEnd = contentRows.length ? Math.min(1, Math.max(...contentRows.map((row) => row.yRatio)) + 0.03) : 1;
    return { headerEnd, footerStart, contentStart, contentEnd };
  }

  function detectQuestionStartsFromRows(rows, bands, pageNo, questionStartNo = null){
    const starts = new Set();
    const ratioByQuestion = new Map();
    const anchors = [];
    const rawAnchors = [];
    for (const row of (rows || [])){
      if (Number.isFinite(bands?.headerEnd) && row.yRatio <= bands.headerEnd) continue;
      if (Number.isFinite(bands?.footerStart) && row.yRatio >= bands.footerStart) continue;
      if (row.xRatio > 0.78) continue;
      const label = parseQuestionLabelFromLineStart(row.line);
      if (!Number.isFinite(label) || label < 1) continue;
      rawAnchors.push({ label, page: pageNo, ratio: row.yRatio, xRatio: row.xRatio, line: row.line });
      const q = mapPrintedQuestionNoToLocal(label, questionStartNo || getActiveQuestionStartNo());
      if (!Number.isFinite(q)) continue;
      starts.add(q);
      if (!ratioByQuestion.has(q) || row.yRatio < ratioByQuestion.get(q)) {
        ratioByQuestion.set(q, row.yRatio);
      }
      anchors.push({ q, label, page: pageNo, ratio: row.yRatio, xRatio: row.xRatio, line: row.line });
    }
    return { starts, ratioByQuestion, anchors, rawAnchors };
  }

  function countOcrChoiceMarkerVariantsInLine(line){
    const raw = String(line || "");
    return (raw.match(/(?:^|[\s])(?:[0OQ@©®]\s*[).:]|Q@|QO|Qo|DO|OD|00|0Q|Q0|[@©®])(?=\s*\S)/g) || []).length;
  }

  function detectChoiceCountFromRows(rows, bands){
    const choices = new Set();
    let variantMarkers = 0;
    for (const row of (rows || [])){
      if (Number.isFinite(bands?.footerStart) && row.yRatio >= bands.footerStart) continue;
      const line = String(row.line || "");
      for (const ch of line.match(/[①②③④⑤]/g) || []){
        const mapped = { "①":1, "②":2, "③":3, "④":4, "⑤":5 }[ch];
        if (Number.isFinite(mapped)) choices.add(mapped);
      }
      variantMarkers += countOcrChoiceMarkerVariantsInLine(line);
    }
    if (choices.size) return choices.size;
    return variantMarkers >= Math.max(3, CHOICE_COUNT) ? CHOICE_COUNT : 0;
  }
  // SOFTM-패턴: OCR이 ①②③④를 0)/Q@/©/® 등으로 깨뜨린 문제지도 선택지 존재 여부만은 패턴 분석에 반영 - 2026-05-30

  function estimatePatternRatio(q, pageNo, ratioByPage, footerBands){
    const byQ = ratioByPage[pageNo];
    if (byQ && Number.isFinite(byQ.get(q))) return Math.max(0, Math.min(1, byQ.get(q)));
    const entries = byQ ? Array.from(byQ.entries()).sort((a, b) => a[0] - b[0]) : [];
    const prev = entries.filter(([k]) => k <= q).pop();
    const next = entries.find(([k]) => k >= q);
    if (prev && next && prev[0] !== next[0]) {
      const t = (q - prev[0]) / Math.max(1, next[0] - prev[0]);
      return Math.max(0.05, Math.min(0.96, prev[1] + (next[1] - prev[1]) * t));
    }
    if (prev) return Math.max(0.05, Math.min(0.96, prev[1] + 0.065 * Math.max(0, q - prev[0])));
    if (next) return Math.max(0.05, Math.min(0.96, next[1] - 0.065 * Math.max(0, next[0] - q)));
    const footerStart = Number(footerBands?.[pageNo]?.footerStart);
    return Math.max(0.08, Math.min(Number.isFinite(footerStart) ? footerStart - 0.08 : 0.86, 0.12));
  }

  function buildPdfPatternMap(startsByPage, ratioByPage, footerBands, pageCount){
    const pageMap = buildQuestionPageMapFromPageStarts(startsByPage, pageCount);
    const ratioMap = Array(QUESTION_COUNT + 1).fill(0.12);
    for (let q = 1; q <= QUESTION_COUNT; q++){
      const pageNo = Math.max(1, Math.min(pageCount, Number(pageMap[q]) || 1));
      ratioMap[q] = estimatePatternRatio(q, pageNo, ratioByPage, footerBands);
    }
    return { pageMap, ratioMap };
  }

  async function mergeOcrStartsIntoPattern(startsByPage, ratioByPage, pageCount, questionStartNo = null){
    for (let pageNo = 1; pageNo <= pageCount; pageNo++){
      try{
        const ocrMap = await getOcrQuestionStartRatiosForPage(pageNo, questionStartNo);
        if (!ocrMap || typeof ocrMap.entries !== "function") continue;
        if (!startsByPage[pageNo]) startsByPage[pageNo] = new Set();
        if (!ratioByPage[pageNo]) ratioByPage[pageNo] = new Map();
        for (const [q, ratio] of ocrMap.entries()){
          if (!Number.isFinite(q) || q < 1 || q > QUESTION_COUNT || !Number.isFinite(ratio)) continue;
          startsByPage[pageNo].add(q);
          if (!ratioByPage[pageNo].has(q)) ratioByPage[pageNo].set(q, ratio);
        }
      }catch(_){}
    }
  }

  async function analyzePdfPattern(pdf, options = {}){
    const pageCount = Math.max(1, Number(pdf?.numPages) || 1);
    const startsByPage = {};
    const ratioByPage = {};
    const contentBands = Array(pageCount + 1).fill(null);
    const footerBands = Array(pageCount + 1).fill(null);
    const allAnchors = [];
    const allRawAnchors = [];
    const detectedRanges = [];
    const choiceCounts = [];
    let a4Pages = 0;

    for (let pageNo = 1; pageNo <= pageCount; pageNo++){
      const rowsInfo = await getQuestionPageRows(pageNo);
      const bands = detectPageBandsFromRows(rowsInfo.rows);
      const detected = detectQuestionStartsFromRows(rowsInfo.rows, bands, pageNo);
      const range = detectQuestionRangeFromRows(rowsInfo.rows);
      const choiceCount = detectChoiceCountFromRows(rowsInfo.rows, bands);
      const isA4 = Math.abs((Number(rowsInfo.pageW) || 0) - 595) < 45 && Math.abs((Number(rowsInfo.pageH) || 0) - 842) < 55;

      contentBands[pageNo] = { start: bands.contentStart, end: bands.contentEnd };
      footerBands[pageNo] = { start: bands.footerStart, end: 1 };
      allRawAnchors.push(...detected.rawAnchors);
      if (range) detectedRanges.push(range);
      if (choiceCount) choiceCounts.push(choiceCount);
      if (isA4) a4Pages += 1;
    }

    const inferredRange = inferQuestionRangeFromPattern(allRawAnchors, detectedRanges);
    const questionStartNo = Number(inferredRange.start) || 1;
    const questionEndNo = questionStartNo + QUESTION_COUNT - 1;
    for (let pageNo = 1; pageNo <= pageCount; pageNo++){
      startsByPage[pageNo] = new Set();
      ratioByPage[pageNo] = new Map();
    }
    for (const anchor of allRawAnchors){
      const q = mapPrintedQuestionNoToLocal(anchor.label, questionStartNo);
      if (!Number.isFinite(q)) continue;
      startsByPage[anchor.page].add(q);
      if (!ratioByPage[anchor.page].has(q) || anchor.ratio < ratioByPage[anchor.page].get(q)) {
        ratioByPage[anchor.page].set(q, anchor.ratio);
      }
      allAnchors.push({ ...anchor, q });
    }

    const uniqueAnchors = new Set(allAnchors.map((a) => a.q));
    if (uniqueAnchors.size < Math.max(4, Math.ceil(QUESTION_COUNT * 0.12)) && options.allowOcr === true) {
      await mergeOcrStartsIntoPattern(startsByPage, ratioByPage, pageCount, questionStartNo);
      for (let pageNo = 1; pageNo <= pageCount; pageNo++){
        for (const q of (startsByPage[pageNo] || [])) uniqueAnchors.add(q);
      }
    }

    const mapped = buildPdfPatternMap(startsByPage, ratioByPage, footerBands, pageCount);
    const pagesWithAnchors = Object.values(startsByPage).filter((set) => set && set.size > 0).length;
    const anchorCoverage = Math.min(1, uniqueAnchors.size / Math.max(1, QUESTION_COUNT));
    const pageCoverage = Math.min(1, pagesWithAnchors / Math.max(1, pageCount));
    const choiceCount = choiceCounts.length ? Math.max(...choiceCounts) : CHOICE_COUNT;
    const choiceScore = Math.min(1, choiceCount / Math.max(1, CHOICE_COUNT));
    const a4Score = pageCount ? a4Pages / pageCount : 0;
    const confidence = Math.max(0, Math.min(1, anchorCoverage * 0.62 + pageCoverage * 0.22 + choiceScore * 0.10 + a4Score * 0.06));
    const footerStarts = footerBands.map((row) => row && Number(row.start)).filter(Number.isFinite);
    const footerStart = footerStarts.length ? footerStarts.sort((a, b) => a - b)[Math.floor(footerStarts.length / 2)] : null;

    return {
      version: PDF_PATTERN_VERSION,
      source: getCurrentPdfSourceKey(),
      generatedAt: new Date().toISOString(),
      pageCount,
      questionCount: QUESTION_COUNT,
      choiceCount,
      questionStartNo,
      questionEndNo,
      questionRangeSource: inferredRange.source || "auto",
      isA4: a4Score >= 0.8,
      anchorsDetected: uniqueAnchors.size,
      pagesWithAnchors,
      questionPageMap: mapped.pageMap,
      questionTopRatioMap: mapped.ratioMap,
      contentBands,
      footerBand: { start: footerStart, end: 1, perPage: footerBands },
      confidence
    };
  }
  /* SOFTM-패턴 끝 */

  function applyPresetMapIfAvailable(){

    state.pdfNav.questionEndNo = QUESTION_END_NO || (state.pdfNav.questionStartNo + QUESTION_COUNT - 1);
    state.pdfNav.printedQuestionNoMap = null;

  function getPresetAnchorsForCurrentExam(){
    let anchors = PRESET_PAGE_ANCHORS[EXAM_NAME];
    if (!anchors) {
      const norm = normalizeExamKey(EXAM_NAME);
      for (const k of Object.keys(PRESET_PAGE_ANCHORS)){
        if (normalizeExamKey(k) === norm) {
          anchors = PRESET_PAGE_ANCHORS[k];
          break;
        }
      }
    }
    if (!anchors) {
      const pdfName = decodeURIComponent(String(QUESTION_PDF_URL || ""));
      const m = pdfName.match(/(20\d{2}).*제\s*([0-9]{1,2})회/);
      if (m) {
        const year = m[1];
        const seq = m[2];
        for (const k of Object.keys(PRESET_PAGE_ANCHORS)){
          if (k.includes(`${year}년`) && k.includes(`제${seq}회`)) {
            anchors = PRESET_PAGE_ANCHORS[k];
            break;
          }
        }
      }
    }
    return Array.isArray(anchors) ? anchors : null;
  }

  function normalizeChoiceToken(token){
    const t = String(token || "").trim();
    if (!t) return null;
    const map = { "①":"1", "②":"2", "③":"3", "④":"4", "⑤":"5" };
    const mapped = map[t] || t;
    if (!/^[1-5]$/.test(mapped)) return null;
    return Number(mapped);
  }

    return null;
  }

  function parseAnswerPairsFromRawText(raw){
    const out = [];
    if (!raw) return out;
    const normalized = String(raw)
      .replace(/[①②③④⑤]/g, (m) => ({ "①":"1","②":"2","③":"3","④":"4","⑤":"5" }[m] || m));
    const lines = normalized.split(/\r?\n/);

    const patterns = [
      /(?:^|\s)(\d{1,3})\s*(?:번|[.])\s*([1-5])(?=\s|$)/g,   // "12. 3" / "12번 3"
      /(?:^|\s)(\d{1,3})\s*[:：]\s*([1-5])(?=\s|$)/g          // "12:3"
    ];

    for (const line of lines){
      const t = line.replace(/\s+/g, " ").trim();
      if (!t) continue;
      if (/page\s*\(/i.test(t)) continue;
      for (const re of patterns){
        let m;
        re.lastIndex = 0;
        while ((m = re.exec(t)) !== null){
          const q = Number(m[1]);
          const a = Number(m[2]);
          if (!Number.isFinite(q) || !Number.isFinite(a)) continue;
          if (q < 1 || q > 999 || a < 1 || a > 5) continue;
          out.push([q, a]);
        }
      }

      // "1 3 2 2 3 3 ..." 형식(문항-정답 페어 연속 나열) 지원
      const nums = (t.match(/\d{1,3}/g) || []).map((v) => Number(v));
      if (nums.length >= 6 && nums.length % 2 === 0){
        let validPairs = 0;
        for (let i = 0; i < nums.length; i += 2){
          const q = nums[i];
          const a = nums[i + 1];
          if (!Number.isFinite(q) || !Number.isFinite(a)) continue;
          if (q < 1 || q > 999 || a < 1 || a > 5) continue;
          out.push([q, a]);
          validPairs++;
        }
        if (validPairs >= 3) continue;
      }
    }

    // 2행 테이블형(윗줄: 문항번호, 아랫줄: 정답번호) 지원
    for (let i = 0; i < lines.length - 1; i++){
      const top = (lines[i] || "").replace(/\s+/g, " ").trim();
      const bottom = (lines[i + 1] || "").replace(/\s+/g, " ").trim();
      if (!top || !bottom) continue;

      const qNums = (top.match(/\d{1,3}/g) || []).map((v) => Number(v)).filter((n) => n >= 1 && n <= 999);
      const aNums = (bottom.match(/[1-5]/g) || []).map((v) => Number(v)).filter((n) => n >= 1 && n <= 5);
      if (qNums.length < 5 || aNums.length < 5) continue;
      if (Math.abs(qNums.length - aNums.length) > 2) continue;

      const len = Math.min(qNums.length, aNums.length);
      for (let j = 0; j < len; j++){
        out.push([qNums[j], aNums[j]]);
      }
    }

    // 줄 경계가 깨진 경우를 위한 전체 텍스트 스캔
    const compact = normalized.replace(/\s+/g, " ");
    const broadPatterns = [
      /(?:^|\s)(\d{1,3})\s*(?:번|[.)]|-)\s*([1-5])(?=\s|$)/g, // "12) 3", "12-3"
      /(?:^|\s)(\d{1,3})\s*[:：]\s*([1-5])(?=\s|$)/g
    ];
    for (const re of broadPatterns){
      let m;
      re.lastIndex = 0;
      while ((m = re.exec(compact)) !== null){
        const q = Number(m[1]);
        const a = Number(m[2]);
        if (!Number.isFinite(q) || !Number.isFinite(a)) continue;
        if (q < 1 || q > 999 || a < 1 || a > 5) continue;
        out.push([q, a]);
      }
    }
    return out;
  }

  function parseAnswerPairsFromNumberStream(nums){
    const out = [];
    if (!Array.isArray(nums) || nums.length < 2) return out;

    let i = 0;
    let prevQ = 0;
    while (i < nums.length - 1){
      const q = Number(nums[i]);
      const a = Number(nums[i + 1]);
      if (Number.isFinite(q) && Number.isFinite(a) && q >= 1 && q <= 999 && a >= 1 && a <= 5){
        // 일반적으로 문항은 증가한다. 잡음 토큰(날짜 등)을 건너뛰기 위한 가드.
        if (q > prevQ || prevQ === 0){
          out.push([q, a]);
          prevQ = q;
          i += 2;
          continue;
        }
      }
      i += 1;
    }
    return out;
  }

  function mapPrintedAnswerPairsToLocalPairs(pairs){
    const cleaned = (pairs || [])
      .map(([q, a]) => [Number(q), normalizeChoiceValue(a)])
      .filter(([q, a]) => Number.isInteger(q) && q > 0 && q <= 999 && Number.isInteger(a) && a >= 1 && a <= 5);
    if (!cleaned.length) return { pairs: [], answerStartNo: normalizeAnswerStartNo({}) };
    const labels = [...new Set(cleaned.map(([q]) => q))].sort((a, b) => a - b);
    const preferred = normalizeAnswerStartNo({});
    const starts = [...new Set([preferred, labels[0], ...labels])].filter((value) => Number.isInteger(value) && value > 0);
    let best = { start: preferred, mapped: [] };
    for (const start of starts){
      const mapped = [];
      for (const [printed, answer] of cleaned){
        const local = printed - start + 1;
        if (local >= 1 && local <= QUESTION_COUNT) mapped.push([local, answer]);
      }
      const score = mapped.length + (start === preferred ? 0.1 : 0);
      const bestScore = best.mapped.length + (best.start === preferred ? 0.1 : 0);
      if (score > bestScore) best = { start, mapped };
    }
    return { pairs: best.mapped, answerStartNo: best.start };
  }
  // SOFTM-정답: PDF 정답표의 번호가 36번처럼 시작해도 내부 문항 번호로 변환해 동적 채점 - 2026-05-30

  function buildLineLikeTextFromItems(items){
    const points = [];
    for (const it of (items || [])){
      const s = String(it?.str || "").trim();
      if (!s) continue;
      const tf = Array.isArray(it?.transform) ? it.transform : null;
      const x = tf && Number.isFinite(tf[4]) ? tf[4] : 0;
      const y = tf && Number.isFinite(tf[5]) ? tf[5] : 0;
      points.push({ s, x, y });
    }
    if (!points.length) return "";
    points.sort((a, b) => (b.y - a.y) || (a.x - b.x));

    const rows = [];
    const yTolerance = 2.4;
    for (const p of points){
      const row = rows.find((r) => Math.abs(r.y - p.y) <= yTolerance);
      if (row){
        row.items.push(p);
      } else {
        rows.push({ y: p.y, items: [p] });
      }
    }
    rows.sort((a, b) => b.y - a.y);
    return rows
      .map((r) => r.items.sort((a, b) => a.x - b.x).map((v) => v.s).join(" "))
      .join("\n");
  }

  async function buildDynamicAnswerKeyFromPdf(options = {}){
    const silent = options.silent === true;
    try{
      state.answerKeyStatus = "loading";
      updateAnswerKeyInfo();
      const pdf = await ensureAnswerPdfDocument();
      const voteBag = new Map(); // q -> Map(answer -> count)

      for (let p = 1; p <= pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const textContent = await page.getTextContent();
        const items = textContent.items || [];
        const rawByItems = items.map((it) => String(it.str || "")).join("\n");
        const rawFlat = items.map((it) => String(it.str || "")).join(" ");
        const rawByRows = buildLineLikeTextFromItems(items);
        const sources = [rawByItems, rawFlat, rawByRows];
        for (const sourceRaw of sources){
          const mapped = mapPrintedAnswerPairsToLocalPairs(parseAnswerPairsFromRawText(sourceRaw));
          const pairs = mapped.pairs;
          if (pairs.length && mapped.answerStartNo) state.answerStartNo = mapped.answerStartNo;
          for (const [q, a] of pairs){
            if (!voteBag.has(q)) voteBag.set(q, new Map());
            const qVotes = voteBag.get(q);
            qVotes.set(a, (qVotes.get(a) || 0) + 1);
          }
        }

        // 숫자 스트림 전용 파싱: "1 3 2 2 3 3 ..." 형태 보강
        const streamNums = items
          .map((it) => String(it?.str || "").trim())
          .filter((s) => /^\d{1,3}$/.test(s))
          .map((s) => Number(s));
        const mappedStream = mapPrintedAnswerPairsToLocalPairs(parseAnswerPairsFromNumberStream(streamNums));
        const streamPairs = mappedStream.pairs;
        if (streamPairs.length && mappedStream.answerStartNo) state.answerStartNo = mappedStream.answerStartNo;
        for (const [q, a] of streamPairs){
          if (!voteBag.has(q)) voteBag.set(q, new Map());
          const qVotes = voteBag.get(q);
          qVotes.set(a, (qVotes.get(a) || 0) + 2);
        }
      }

      const merged = new Map();
      for (let q = 1; q <= QUESTION_COUNT; q++){
        const qVotes = voteBag.get(q);
        if (!qVotes || qVotes.size === 0) continue;
        const ranked = Array.from(qVotes.entries()).sort((a, b) => b[1] - a[1]);
        if (ranked.length === 1) {
          merged.set(q, ranked[0][0]);
          continue;
        }
        // 충돌 허용 폭을 조금 완화해 누락을 줄인다.
        if (ranked[0][1] >= ranked[1][1] + 1 || ranked[0][1] >= 3) {
          merged.set(q, ranked[0][0]);
        }
      }

      const dyn = Array(QUESTION_COUNT + 1).fill(null);
      for (const [q, a] of merged.entries()) dyn[q] = a;
      state.answerKeyDynamic = dyn;
      state.answerEndNo = (Number(state.answerStartNo) || normalizeAnswerStartNo({})) + QUESTION_COUNT - 1;
      state.answerKeyStatus = merged.size >= Math.min(QUESTION_COUNT, 70) ? "ready" : (merged.size > 0 ? "partial" : "unavailable");
    }catch(_){
      state.answerKeyDynamic = null;
      state.answerKeyStatus = "unavailable";
    } finally {
      updateAnswerKeyInfo();
      refreshAllCards();
      updateStats();
      applyFilter();
      if (!silent && state.answerKeyStatus !== "ready") {
        alert("정답 PDF 분석이 완전하지 않아 일부 문항은 채점이 보류됩니다.");
      }
    }
  }

  async function locateQuestionInPdf(q){
    const cacheKey = `${getCurrentPdfSourceKey()}|${PDF_MAP_VERSION}|q:${Math.max(1, Math.min(QUESTION_COUNT, Math.floor(Number(q) || 1)))}`;
    if (state.locateQuestionCache && state.locateQuestionCache[cacheKey]) {
      return state.locateQuestionCache[cacheKey];
    }
    const pdf = await ensurePdfDocument();
    const total = pdf.numPages || 1;
    const hasQuestionOnPage = async (pageNo, targetQ) => {
      if (!Number.isFinite(pageNo) || pageNo < 1 || pageNo > total) return false;
      try{
        const rowStarts = await getRowQuestionStartRatiosForPage(pageNo);
        if (rowStarts && Number.isFinite(rowStarts.get(targetQ))) return true;
        const directStarts = await getDirectQuestionRatiosForPage(pageNo);
        if (directStarts && Number.isFinite(directStarts.get(targetQ))) return true;
        const pageRatios = await getQuestionRatiosForPage(pageNo);
        if (pageRatios && Number.isFinite(pageRatios.get(targetQ))) return true;
      }catch(_){}
      return false;
    };
    const resolveBetterPage = async (mappedPage, targetQ) => {
      const p = Math.max(1, Math.min(total, Math.floor(mappedPage)));
      const candidates = [p, p - 1, p + 1];
      for (const cand of candidates){
        if (await hasQuestionOnPage(cand, targetQ)) return cand;
      }
      return p;
    };
    const refineRatioOnPage = async (pageNo, fallbackRatio) => {
      const safeRatio = Number.isFinite(fallbackRatio) ? Math.max(0, Math.min(1, fallbackRatio)) : 0.12;
      const p = Math.max(1, Math.min(total, Math.floor(pageNo)));
      try{
        const candidates = [];
        const rowStarts = await getRowQuestionStartRatiosForPage(p);
        if (rowStarts && Number.isFinite(rowStarts.get(q))) candidates.push(rowStarts.get(q));
        const directStarts = await getDirectQuestionRatiosForPage(p);
        if (directStarts && Number.isFinite(directStarts.get(q))) candidates.push(directStarts.get(q));
        const pageRatios = await getQuestionRatiosForPage(p);
        if (pageRatios && Number.isFinite(pageRatios.get(q))) candidates.push(pageRatios.get(q));
        if (candidates.length){
          candidates.sort((a, b) => a - b);
          return Math.max(0, Math.min(1, candidates[Math.floor(candidates.length / 2)]));
        }
      }catch(_){}
      return safeRatio;
    };

    // 기본 페이지맵을 사용하되, 페이지 내부 비율은 실제 텍스트 검출로 보정한다.
    const pageMap = state.pdfNav.questionPageMap;
    const ratioMap = state.pdfNav.questionTopRatioMap;
    if (Array.isArray(pageMap) && Array.isArray(ratioMap) && Number.isFinite(pageMap[q])) {
      const mappedPage = Math.max(1, Math.min(total, Math.floor(pageMap[q])));
      const p = await resolveBetterPage(mappedPage, q);
      const r = await refineRatioOnPage(p, ratioMap[q]);
      const result = { page: p, ratio: r, exact: true };
      state.locateQuestionCache[cacheKey] = result;
      return result;
    }
    const presetAnchors = getPresetAnchorsForCurrentExam();
    if (presetAnchors) {
      const mapped = buildMapFromAnchors(presetAnchors);
      const mappedPage = Math.max(1, Math.min(total, Number(mapped.pageMap[q]) || getPdfPageByQuestion(q)));
      const p = await resolveBetterPage(mappedPage, q);
      const r = await refineRatioOnPage(p, mapped.ratioMap[q]);
      const result = { page: p, ratio: r, exact: true };
      state.locateQuestionCache[cacheKey] = result;
      return result;
    }
    const predicted = Math.max(1, Math.min(total, getPdfPageByQuestion(q)));
    const result = { page: predicted, ratio: 0.12, exact: false };
    state.locateQuestionCache[cacheKey] = result;
    return result;
  }

  async function getDirectQuestionRatiosForPage(pageNo){
    const key = String(pageNo);
    if (state.pageQuestionDirectRatioCache[key]) return state.pageQuestionDirectRatioCache[key];
    const layer = await getQuestionPageTextLayer(pageNo);
    const pageW = layer.pageW;
    const pageH = layer.pageH;
    const map = new Map();

    for (const item of (layer.items || [])){
      const s = String(item.str || "").trim();
      if (!s) continue;
      const m = s.match(/^\(?\s*(\d{1,3})\s*(?:[.]|번)(?:\s|$)/);
      if (!m) continue;
      const q = mapPrintedQuestionNoToLocal(Number(m[1]));
      if (!Number.isFinite(q)) continue;

      const x = Number(item.transform && item.transform[4]);
      const y = Number(item.transform && item.transform[5]);
      if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
      const xRatio = x / pageW;
      if (xRatio > 0.78) continue; // SOFTM-KNOU: 오른쪽 컬럼 문항번호도 탐지하도록 x범위 확장 - 2026-05-29

      const ih = Math.max(8, Math.abs(Number(item.height) || 0));
      const top = Math.max(0, Math.min(pageH - ih, pageH - y - ih));
      const ratio = Math.max(0, Math.min(1, top / pageH));
      if (!map.has(q) || ratio < map.get(q)) map.set(q, ratio);
    }

    state.pageQuestionDirectRatioCache[key] = map;
    return map;
  }

  async function getRowQuestionStartRatiosForPage(pageNo){
    const key = String(pageNo);
    if (state.pageQuestionRowStartCache[key]) return state.pageQuestionRowStartCache[key];
    const { rows } = await getQuestionPageRows(pageNo);
    const byQ = new Map();
    for (const row of rows){
      if (!row.parts.length) continue;
      if (row.xRatio > 0.78) continue; // SOFTM-KNOU: 2컬럼 방통대 문제지의 오른쪽 문항번호 탐지 허용 - 2026-05-29
      const lineText = row.line;
      const m = lineText.match(/^\(?\s*(\d{1,3})\s*(?:[.]|번)(?:\s|$)/);
      if (!m) continue;
      const q = mapPrintedQuestionNoToLocal(Number(m[1]));
      if (!Number.isFinite(q)) continue;
      const ratio = Math.max(0, Math.min(1, Number(row.yRatio)));
      if (!byQ.has(q) || ratio < byQ.get(q)) byQ.set(q, ratio);
    }

    state.pageQuestionRowStartCache[key] = byQ;
    return byQ;
  }

  async function getQuestionStartAnchorsForPage(pageNo){
    const key = String(pageNo);
    if (state.pageQuestionStartAnchorCache[key]) return state.pageQuestionStartAnchorCache[key];
    const layer = await getQuestionPageTextLayer(pageNo);
    const pageW = layer.pageW;
    const pageH = layer.pageH;
    const { rows } = await getQuestionPageRows(pageNo, 2.0);

    const itemAnchors = new Map();
    for (const it of (layer.items || [])){
      const s = String(it.str || "").trim();
      if (!s) continue;
      const x = Number(it.transform && it.transform[4]);
      const y = Number(it.transform && it.transform[5]);
      if (!Number.isFinite(x) || !Number.isFinite(y)) continue;

      const token = s.replace(/\s+/g, "");
      const tm = token.match(/^\(?(\d{1,3})(?:[.]|번)\)?$/);
      if (tm) {
        const q = mapPrintedQuestionNoToLocal(Number(tm[1]));
        const xRatio = x / pageW;
        if (Number.isFinite(q) && xRatio <= 0.78) { // SOFTM-KNOU: 오른쪽 컬럼 단독 라벨 토큰까지 앵커로 사용 - 2026-05-29
          const ih = Math.max(10, Math.abs(Number(it.height) || 0));
          const top = Math.max(0, Math.min(pageH - ih, pageH - y - ih));
          const yRatio = Math.max(0, Math.min(1, top / pageH));
          const prev = itemAnchors.get(q);
          if (!prev || yRatio < prev.yRatio) {
            itemAnchors.set(q, { xRatio: Math.max(0, Math.min(1, xRatio)), yRatio });
          }
        }
      }

    }

    const map = new Map(itemAnchors);
    for (const row of rows){
      if (!row.parts.length) continue;
      if (row.xRatio > 0.78) continue; // SOFTM-KNOU: 2컬럼 레이아웃의 오른쪽 문항 시작점 허용 - 2026-05-29
      const line = row.line;
      const m = line.match(/^\(?\s*(\d{1,3})\s*(?:[.]|번)(?:\s|$)/);
      if (!m) continue;
      const q = mapPrintedQuestionNoToLocal(Number(m[1]));
      if (!Number.isFinite(q)) continue;
      if (line.length < 6) continue;
      const yRatio = Math.max(0, Math.min(1, Number(row.yRatio)));
      const xRatio = Math.max(0, Math.min(1, Number(row.xRatio)));
      const prev = map.get(q);
      if (!prev || yRatio < prev.yRatio) map.set(q, { xRatio, yRatio });
    }

    state.pageQuestionStartAnchorCache[key] = map;
    return map;
  }

  async function getNextQuestionBoundaryRatioForPage(pageNo, q, startRatio = null, minAfterRatio = null){
    const base = Number.isFinite(startRatio) ? Math.max(0, Math.min(1, Number(startRatio))) : 0;
    const after = Number.isFinite(minAfterRatio) ? Math.max(0, Math.min(1, Number(minAfterRatio))) : null;
    const minGap = 0.03;
    const trusted = [];
    const fallback = [];
    const seen = new Set();
    const push = (arr, v) => {
      if (!Number.isFinite(v)) return;
      const r = Math.max(0, Math.min(1, Number(v)));
      if (r <= base + minGap) return;
      // 선택지 하단과 다음 문항 시작이 매우 근접한(촘촘한) 레이아웃이 있어
      // 과도한 최소 간격 필터를 쓰면 q+1 경계를 놓치게 된다.
      if (after != null && r <= (after + 0.0015)) return;
      const key = r.toFixed(5);
      if (seen.has(key)) return;
      seen.add(key);
      arr.push(r);
    };

    const pageMap = state.pdfNav.questionPageMap;
    const ratioMap = state.pdfNav.questionTopRatioMap;
    if (Array.isArray(pageMap) && Array.isArray(ratioMap)) {
      for (let k = q + 1; k <= QUESTION_COUNT; k++){
        if (pageMap[k] !== pageNo || !Number.isFinite(ratioMap[k])) continue;
        push(trusted, ratioMap[k]);
      }
    }

    try{
      const anchorMap = await getQuestionStartAnchorsForPage(pageNo);
      if (anchorMap && typeof anchorMap.entries === "function") {
        for (const [k, v] of anchorMap.entries()){
          if (!Number.isFinite(k) || !v || !Number.isFinite(v.yRatio)) continue;
          if (k <= q) continue;
          push(trusted, v.yRatio);
        }
      }
    }catch(_){}

    try{
      const next = await locateQuestionInPdf(q + 1);
      if (next && next.page === pageNo && Number.isFinite(next.ratio)) {
        push(trusted, next.ratio);
      }
    }catch(_){}

    if (trusted.length) {
      trusted.sort((a, b) => a - b);
      return trusted[0];
    }

    try{
      const maps = [
        await getQuestionRatiosForPage(pageNo),
        await getRowQuestionStartRatiosForPage(pageNo),
        await getDirectQuestionRatiosForPage(pageNo),
        await getReliableQuestionStartsForPage(pageNo)
      ];
      for (const m of maps){
        if (!m || typeof m.entries !== "function") continue;
        for (const [k, v] of m.entries()){
          if (!Number.isFinite(k) || !Number.isFinite(v)) continue;
          if (k <= q) continue;
          push(fallback, v);
        }
      }
    }catch(_){}

    if (fallback.length) {
      fallback.sort((a, b) => a - b);
      return fallback[0];
    }
    return null;
  }

  async function getNearestNextQuestionStartRatioForPage(pageNo, q, startRatio = null){
    const base = Number.isFinite(startRatio) ? Math.max(0, Math.min(1, Number(startRatio))) : 0;
    const out = [];
    const seen = new Set();
    const push = (v) => {
      if (!Number.isFinite(v)) return;
      const r = Math.max(0, Math.min(1, Number(v)));
      if (r <= base + 0.015) return;
      const key = r.toFixed(5);
      if (seen.has(key)) return;
      seen.add(key);
      out.push(r);
    };

    try{
      const tokenMap = await getQuestionLabelTokenRatiosForPage(pageNo);
      if (tokenMap && typeof tokenMap.entries === "function") {
        for (const [k, v] of tokenMap.entries()){
          if (!Number.isFinite(k) || k <= q) continue;
          push(v);
        }
      }
    }catch(_){}

    try{
      const anchorMap = await getQuestionStartAnchorsForPage(pageNo);
      if (anchorMap && typeof anchorMap.entries === "function") {
        for (const [k, v] of anchorMap.entries()){
          if (!Number.isFinite(k) || k <= q || !v || !Number.isFinite(v.yRatio)) continue;
          push(v.yRatio);
        }
      }
    }catch(_){}

    try{
      const maps = [
        await getQuestionRatiosForPage(pageNo),
        await getRowQuestionStartRatiosForPage(pageNo),
        await getDirectQuestionRatiosForPage(pageNo),
        await getReliableQuestionStartsForPage(pageNo)
      ];
      for (const m of maps){
        if (!m || typeof m.entries !== "function") continue;
        for (const [k, v] of m.entries()){
          if (!Number.isFinite(k) || k <= q) continue;
          push(v);
        }
      }
    }catch(_){}

    if (!out.length) return null;
    out.sort((a, b) => a - b);
    return out[0];

  async function getQuestionStartRatioForPage(pageNo, q, options = null){
    if (!Number.isFinite(pageNo) || !Number.isFinite(q)) return null;
    const allowOcr = !!(options && options.allowOcr === true);
    try{
      const exact = await getExactQuestionLabelRatioForPage(pageNo, q);
      if (Number.isFinite(exact)) return Math.max(0, Math.min(1, Number(exact)));
    }catch(_){}
    try{
      const anchorMap = await getQuestionStartAnchorsForPage(pageNo);
      const a = anchorMap && anchorMap.get(q);
      if (a && Number.isFinite(a.yRatio)) {
        return Math.max(0, Math.min(1, Number(a.yRatio)));
      }
    }catch(_){}
    try{
      const pageRatios = await getQuestionRatiosForPage(pageNo);
      if (pageRatios && Number.isFinite(pageRatios.get(q))) {

    }catch(_){}
    const pageMap = state.pdfNav.questionPageMap;
    const ratioMap = state.pdfNav.questionTopRatioMap;
    if (Array.isArray(pageMap) && Array.isArray(ratioMap) && pageMap[q] === pageNo && Number.isFinite(ratioMap[q])) {

      if (located && located.page === pageNo && Number.isFinite(located.ratio)) {

    if (allowOcr) {
