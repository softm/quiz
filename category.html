<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>카테고리 회차 목록</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f9fafb;
      --ink: #1f2933;
      --muted: #66788a;
      --line: #d9e0e7;
      --line-strong: #b7c4d1;
      --accent: #176b75;
      --accent-strong: #10565f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "SUIT", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
    }

    a { color: inherit; }

    .container {
      width: min(1180px, 94vw);
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .top {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .back {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      background: var(--panel);
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
    }

    .pageHead {
      margin-top: 18px;
      display: grid;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 3.5vw, 40px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .adWrap {
      margin-top: 18px;
      min-height: 92px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      padding: 8px;
    }

    .toolbar {
      margin-top: 14px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px;
    }

    .srOnly {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .searchInput,
    .sortSelect {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--ink);
      font-size: 14px;
      padding: 0 12px;
      outline: none;
    }

    .searchInput:focus,
    .sortSelect:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23,107,117,.14);
      background: #fff;
    }

    .listHead {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .listHead strong {
      color: var(--ink);
      font-size: 15px;
    }

    .list {
      margin-top: 10px;
      display: grid;
      gap: 10px;
    }

    .examRow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
    }

    .examRow:hover {
      border-color: var(--line-strong);
      box-shadow: 0 8px 18px rgba(24,39,56,.06);
    }

    .examRow.clickable {
      cursor: pointer;
    }

    .examRow.clickable:focus-visible {
      outline: 3px solid rgba(23,107,117,.18);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(23,107,117,.18);
    }

    .rowMain {
      min-width: 0;
      display: grid;
      gap: 8px;
    }

    .nameLine {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .name {
      margin: 0;
      min-width: 0;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .miniBadge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 3px 8px;
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
      background: var(--panel-soft);
      color: var(--muted);
    }

    .metaLine {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .detailLine {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      min-width: 260px;
    }

    .btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--ink);
      white-space: nowrap;
    }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .btn.primary:hover { background: var(--accent-strong); }

    .btn.disabled {
      pointer-events: none;
      opacity: .44;
    }

    .empty {
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      padding: 28px 18px;
      color: var(--muted);
      background: var(--panel);
      text-align: center;
    }

    @media (max-width: 960px) {
      .toolbar { grid-template-columns: 1fr; }
      .examRow { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; min-width: 0; }
    }

    @media (max-width: 620px) {
      .container { padding-top: 22px; }
      .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="top">
      <a class="back" href="./index.html">메인으로</a>
      <div id="meta" class="meta">데이터 로딩 중...</div>
    </div>

    <header class="pageHead">
      <h1 id="title">카테고리</h1>
      <p class="desc" id="subtitle">회차 목록</p>
    </header>

    <section class="adWrap" id="adfitCategoryTop">광고 영역</section>

    <section class="toolbar" aria-label="회차 목록 제어">
      <label class="srOnly" for="searchInput">회차 검색</label>
      <input id="searchInput" class="searchInput" type="search" placeholder="회차명, 연도, 시험 유형 검색" autocomplete="off" />

      <label class="srOnly" for="sortSelect">정렬</label>
      <select id="sortSelect" class="sortSelect" aria-label="정렬">
        <option value="seq">등록순</option>
        <option value="latest">최신 연도순</option>
        <option value="name">이름순</option>
      </select>
    </section>

    <div class="listHead">
      <strong id="resultCount">회차 0개</strong>
      <span id="resultHint">전체</span>
    </div>
    <section class="list" id="list"></section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const DATASET = params.get("dataset") === "knou" ? "knou" : "default";
    const categoryName = params.get("category") || "농산물품질관리사";
    const categoryNo = params.get("catNo") || "";
    const ADFIT_UNITS = {
      categoryTop: "DAN_REPLACE_CATEGORY_TOP",
    };
    const state = {
      items: [],
      query: "",
      sort: "seq",
    };

    function loadAdFitScript() {
      if (window.__adfitLoaded) return;
      const script = document.createElement("script");
      script.async = true;
      script.src = "https://t1.daumcdn.net/kas/static/ba.min.js";
      script.onload = () => { window.__adfitLoaded = true; };
      document.head.appendChild(script);
    }

    function initAdFit(slotId, unit, width, height) {
      const slot = document.getElementById(slotId);
      if (!slot) return;
      if (!unit || !unit.startsWith("DAN-")) {
        slot.textContent = "광고 단위 ID를 설정하면 이 위치에 배너가 노출됩니다.";
        return;
      }
      slot.innerHTML = `<ins class="kakao_ad_area" style="display:none;" data-ad-unit="${unit}" data-ad-width="${width}" data-ad-height="${height}"></ins>`;
      loadAdFitScript();
    }

    function normalizePdfPath(path) {
      const raw = String(path || "").trim();
      if (!raw) return "";
      return raw.replace(/^\.\//, "").replace(/^quiz\//, "");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[ch]));
    }

    function isPublishedQuestion(row) {
      if (String(row?.correctJson || "").trim()) return true;
      if (String(row?.answerSourceId || "").trim()) return true;
      if (Object.prototype.hasOwnProperty.call(row || {}, "published")) {
        return row?.published === true || String(row?.published) === "true";
      }
      return Boolean(normalizePdfPath(row?.answerPdf) || String(row?.answerSourceId || "").trim());
    }

    function collectDescendantCatNos(categories, catNo) {
      const out = new Set([String(catNo)]);
      let changed = true;
      while (changed) {
        changed = false;
        for (const category of categories || []) {
          const parent = String(category.parentCatNo || "");
          const current = String(category.catNo || "");
          if (parent && out.has(parent) && !out.has(current)) {
            out.add(current);
            changed = true;
          }
        }
      }
      return out;
    }

    function makeCategoryUrl(category) {
      const q = new URLSearchParams({
        catNo: category.catNo,
        category: category.catNm,
      });
      if (DATASET === "knou") q.set("dataset", "knou");
      return `./category.html?${q.toString()}`;
    }

    function makeQuizUrl(exam) {
      const question = normalizePdfPath(exam.questionPdf);
      const answer = normalizePdfPath(exam.answerPdf);
      const q = new URLSearchParams({
        dataset: DATASET,
        category: exam.catNm || categoryName,
        catNo: exam.catNo || categoryNo,
        exam: exam.questionNm,
        questionNo: exam.questionNo || "",
        question,
        answer,
      });
      if (exam.answerSourceId) q.set("answerSourceId", exam.answerSourceId);
      if (exam.answerSubject) q.set("answerSubject", exam.answerSubject);
      if (exam.grade) q.set("grade", exam.grade);
      if (exam.questionCount) q.set("questionCount", exam.questionCount);
      if (exam.questionStartNo) q.set("questionStartNo", exam.questionStartNo);
      if (exam.questionEndNo) q.set("questionEndNo", exam.questionEndNo);
      if (exam.choiceCount) q.set("choiceCount", exam.choiceCount);
      if (exam.correctJson) q.set("correct", normalizePdfPath(exam.correctJson));
      return `./quiz.html?${q.toString()}`;
    }

    async function fetchJson(path) {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) throw new Error(`fetch failed: ${path}`);
      return res.json();
    }

    function numericYear(item) {
      const raw = item.exam?.year || item.year || item.name || "";
      const match = String(raw).match(/(19|20)\d{2}/);
      return match ? Number(match[0]) : 0;
    }

    function formatQuestionMeta(exam) {
      const count = Number(exam.questionCount || exam.answerCount || 0);
      const start = Number(exam.questionStartNo || exam.answerStartNo || 0);
      const end = Number(exam.questionEndNo || exam.answerEndNo || 0);
      if (start && end && start !== 1) return `${start}-${end}번`;
      if (count) return `${count}문항`;
      return "문항 수 미확인";
    }

    function fileNameFromPath(path) {
      const normalized = normalizePdfPath(path);
      if (!normalized) return "";
      return decodeURIComponent(normalized.split("/").pop() || normalized);
    }

    function makeSearchText(item) {
      if (item.kind === "category") {
        return [item.name, item.childReady, "과목"].join(" ").toLowerCase();
      }
      const exam = item.exam;
      return [
        item.name,
        exam.year,
        exam.semester,
        exam.examType,
        exam.questionNo,
        exam.questionPdf,
        exam.answerPdf,
      ].join(" ").toLowerCase();
    }

    function filterItems(items) {
      const query = state.query.trim().toLowerCase();
      return items.filter((item) => {
        if (query && !makeSearchText(item).includes(query)) return false;
        return true;
      });
    }

    function sortItems(items) {
      const rows = items.slice();
      rows.sort((a, b) => {
        if (a.kind !== b.kind) return a.kind === "category" ? -1 : 1;
        if (state.sort === "latest") {
          return numericYear(b) - numericYear(a) || Number(a.seq || 0) - Number(b.seq || 0);
        }
        if (state.sort === "name") {
          return String(a.name || "").localeCompare(String(b.name || ""), "ko");
        }
        return Number(a.seq || 0) - Number(b.seq || 0);
      });
      return rows;
    }

    function renderCategoryRow(item) {
      const href = makeCategoryUrl(item.category);
      const ready = Boolean(item.childReady);
      const rowAttrs = ready
        ? `tabindex="0" role="link" data-primary-url="${escapeHtml(href)}" aria-label="${escapeHtml(`${item.name} 열기`)}"`
        : "";
      return `
        <article class="examRow ${ready ? "clickable" : ""}" ${rowAttrs}>
          <div class="rowMain">
            <div class="nameLine">
              <h2 class="name">${escapeHtml(item.name)}</h2>
            </div>
            <div class="metaLine">
              <span class="miniBadge">회차 ${item.childReady}개</span>
            </div>
            <div class="detailLine">${escapeHtml(item.category.catPath || item.name)}</div>
          </div>
          <div class="actions">
            <a class="btn primary ${ready ? "" : "disabled"}" href="${escapeHtml(href)}">열기</a>
          </div>
        </article>
      `;
    }

    function renderExamRow(item) {
      const exam = item.exam;
      const questionPath = normalizePdfPath(exam.questionPdf);
      const answerPath = normalizePdfPath(exam.answerPdf);
      const ready = Boolean(questionPath && isPublishedQuestion(exam));
      const quizUrl = makeQuizUrl(exam);
      const qLink = questionPath ? `./${encodeURI(questionPath)}` : "#";
      const aLink = answerPath ? `./${encodeURI(answerPath)}` : "#";
      const answerLabel = DATASET === "knou" ? "정답 파일" : "정답 PDF";
      const year = numericYear(item) || "";
      const examType = [exam.semester, exam.examType].filter(Boolean).join(" · ");
      const detail = [
        fileNameFromPath(exam.questionPdf),
        answerPath ? fileNameFromPath(exam.answerPdf) : (exam.answerSourceId ? `정답 원본 ${exam.answerSourceId}` : ""),
      ].filter(Boolean).join(" / ");
      const rowAttrs = ready
        ? `tabindex="0" role="link" data-primary-url="${escapeHtml(quizUrl)}" aria-label="${escapeHtml(`${item.name} 풀이 시작`)}"`
        : "";

      return `
        <article class="examRow ${ready ? "clickable" : ""}" ${rowAttrs}>
          <div class="rowMain">
            <div class="nameLine">
              <h2 class="name">${escapeHtml(item.name)}</h2>
            </div>
            <div class="metaLine">
              ${year ? `<span class="miniBadge">${year}</span>` : ""}
              ${examType ? `<span class="miniBadge">${escapeHtml(examType)}</span>` : ""}
              <span class="miniBadge">${escapeHtml(formatQuestionMeta(exam))}</span>
              ${exam.choiceCount ? `<span class="miniBadge">${escapeHtml(exam.choiceCount)}지선다</span>` : ""}
            </div>
            <div class="detailLine">${escapeHtml(detail || "파일 정보 없음")}</div>
          </div>
          <div class="actions">
            <a class="btn primary ${ready ? "" : "disabled"}" href="${escapeHtml(quizUrl)}">풀이 시작</a>
            <a class="btn ${questionPath ? "" : "disabled"}" href="${escapeHtml(qLink)}" target="_blank">문제 PDF</a>
            <a class="btn ${answerPath ? "" : "disabled"}" href="${escapeHtml(aLink)}" target="_blank">${answerLabel}</a>
          </div>
        </article>
      `;
    }

    function renderList() {
      const list = document.getElementById("list");
      const resultCount = document.getElementById("resultCount");
      const resultHint = document.getElementById("resultHint");
      const rows = sortItems(filterItems(state.items));
      const examCount = rows.filter((item) => item.kind === "exam").length;
      const categoryCount = rows.filter((item) => item.kind === "category").length;
      const hint = [
        state.query.trim() ? `"${state.query.trim()}"` : "전체",
      ].filter(Boolean).join(" · ");

      resultCount.textContent = [
        categoryCount ? `과목 ${categoryCount}개` : "",
        `회차 ${examCount}개`,
      ].filter(Boolean).join(" · ");
      resultHint.textContent = hint || "전체";

      if (!rows.length) {
        list.innerHTML = '<article class="empty">조건에 맞는 회차가 없습니다.</article>';
        return;
      }

      list.innerHTML = rows.map((item) =>
        item.kind === "category" ? renderCategoryRow(item) : renderExamRow(item)
      ).join("");
    }

    function bindControls() {
      const searchInput = document.getElementById("searchInput");
      const sortSelect = document.getElementById("sortSelect");

      searchInput.addEventListener("input", () => {
        state.query = searchInput.value;
        renderList();
      });

      sortSelect.addEventListener("change", () => {
        state.sort = sortSelect.value;
        renderList();
      });

      const list = document.getElementById("list");
      list.addEventListener("click", (event) => {
        if (event.target.closest("a, button, input, select, textarea")) return;
        const row = event.target.closest("[data-primary-url]");
        if (!row) return;
        window.location.href = row.dataset.primaryUrl;
      });

      list.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const row = event.target.closest("[data-primary-url]");
        if (!row) return;
        event.preventDefault();
        window.location.href = row.dataset.primaryUrl;
      });
    }

    async function load() {
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const meta = document.getElementById("meta");
      const list = document.getElementById("list");

      title.textContent = categoryName;

      try {
        const categoryPath = DATASET === "knou" ? "./json/knou_category.json" : "./json/category.json";
        const questionPath = DATASET === "knou" ? "./json/knou_question.json" : "./json/question.json";
        const [categories, questions] = await Promise.all([
          fetchJson(categoryPath),
          fetchJson(questionPath),
        ]);
        const category = (categories || []).find((c) =>
          (categoryNo && String(c.catNo) === String(categoryNo)) ||
          (!categoryNo && String(c.catNm) === String(categoryName))
        );
        const catNo = category ? category.catNo : categoryNo;
        const children = (categories || [])
          .filter((c) => String(c.parentCatNo || "") === String(catNo))
          .sort((a, b) => Number(a.seq || 0) - Number(b.seq || 0));
        const exams = (questions || [])
          .filter((q) => String(q.catNo) === String(catNo))
          .filter((q) => isPublishedQuestion(q))
          .sort((a, b) => Number(a.seq || 0) - Number(b.seq || 0));

        state.items = [];

        for (const child of children) {
          const childCatNos = collectDescendantCatNos(categories, child.catNo);
          const childExams = (questions || []).filter((q) => childCatNos.has(String(q.catNo)));
          const childReady = childExams.filter((q) => normalizePdfPath(q.questionPdf) && isPublishedQuestion(q)).length;
          state.items.push({
            kind: "category",
            name: child.catNm,
            category: child,
            childReady,
            childRegistered: childExams.length,
            seq: Number(child.seq || 0),
          });
        }

        for (const exam of exams) {
          state.items.push({
            kind: "exam",
            name: exam.questionNm,
            exam,
            seq: Number(exam.seq || 0),
          });
        }

        const readyCount = exams.filter((e) => normalizePdfPath(e.questionPdf) && isPublishedQuestion(e)).length;
        meta.textContent = `${DATASET === "knou" ? "방통대" : "문제은행"} · ${category?.gNm || categoryName}`;
        subtitle.textContent = [
          children.length ? `과목 ${children.length}개` : "",
          `회차 ${readyCount}개`,
        ].filter(Boolean).join(" · ");

        renderList();
      } catch (err) {
        meta.textContent = "데이터를 불러오지 못했습니다.";
        list.innerHTML = '<article class="empty">json 데이터(group/category/question)를 확인하세요.</article>';
      }
    }

    initAdFit("adfitCategoryTop", ADFIT_UNITS.categoryTop, "728", "90");
    bindControls();
    load();
  </script>
</body>
</html>
