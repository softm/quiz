<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>자격증 문제은행 메인</title>
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #1e2a33;
      --card: #fffdf8;
      --line: #d8cbb8;
      --accent-1: #296c73;
      --accent-2: #e8a234;
      --accent-3: #c84e3e;
      --muted: #61717f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Pretendard", "SUIT", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 90% 5%, rgba(41,108,115,.20), transparent 30%),
        radial-gradient(circle at 5% 95%, rgba(200,78,62,.15), transparent 35%),
        var(--bg);
      min-height: 100vh;
    }

    .container {
      width: min(1100px, 92vw);
      margin: 0 auto;
      padding: 40px 0 56px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    /* SOFTM-KNOU 시작: 기존/방통대 과목 통합 검색 UI 추가 - 2026-05-29 */
    .searchPanel {
      margin-top: 18px;
      display: grid;
      gap: 8px;
    }

    .searchInput {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.82);
      color: var(--ink);
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
    }

    .searchInput:focus {
      border-color: var(--accent-1);
      box-shadow: 0 0 0 3px rgba(41,108,115,.14);
    }

    .searchHelp {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .emptySearch {
      display: none;
      margin-top: 18px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 18px;
      color: var(--muted);
      background: rgba(255,255,255,.58);
      font-size: 14px;
    }
    /* SOFTM-KNOU 끝 */
    .adWrap {
      margin-top: 16px;
      min-height: 100px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      padding: 8px;
    }

    .grid {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .banner {
      position: relative;
      text-decoration: none;
      color: inherit;
      background: linear-gradient(145deg, rgba(255,255,255,.95), rgba(255,253,248,.90));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      min-height: 170px;
      box-shadow: 0 12px 24px rgba(30,42,51,.08);
      transition: transform .18s ease, box-shadow .18s ease;
      overflow: hidden;
    }

    .banner:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 26px rgba(30,42,51,.13);
    }

    .banner::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 100px;
      right: -35px;
      top: -35px;
      opacity: .2;
    }

    .banner[data-kind="qcm"]::after { background: var(--accent-1); }
    .banner[data-kind="greenhouse"]::after { background: var(--accent-2); }
    .banner[data-kind="organic"]::after { background: var(--accent-3); }
    .banner[data-kind="knou"]::after { background: #5f6fb1; } /* SOFTM-KNOU: 방통대 카드 식별 색상 추가 - 2026-05-29 */

    .badge {
      display: inline-block;
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--muted);
      background: rgba(255,255,255,.65);
    }

    .title {
      margin: 10px 0 4px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .count {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .cta {
      margin-top: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 980px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      .container { padding-top: 28px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>문제은행</h1>
    <p class="subtitle">카테고리별로 회차를 선택해서 문제 PDF와 정답 파일 기반으로 풀이를 시작합니다.</p>
    <p class="meta" id="generatedAt">데이터 로딩 중...</p>
    <!-- SOFTM-KNOU 시작: 전체 과목명 검색 입력 추가 - 2026-05-29 -->
    <section class="searchPanel" aria-label="전체 과목 검색">
      <input id="searchInput" class="searchInput" type="search" placeholder="과목명 검색 (예: 농산물, 글쓰기, 컴퓨터)" autocomplete="off" />
      <p id="searchHelp" class="searchHelp">기존 문제은행과 방통대 교과목을 함께 검색합니다.</p>
    </section>
    <section id="emptySearch" class="emptySearch">검색 결과가 없습니다.</section>
    <!-- SOFTM-KNOU 끝 -->
    <section class="adWrap" id="adfitIndexTop">광고 영역</section>

    <section class="grid" id="categoryGrid"></section>
  </main>

  <script>
    const kindByCategory = {
      "농산물품질관리사": "qcm",
      "시설원예기사": "greenhouse",
      "유기농업기사": "organic",
    };
    const ADFIT_UNITS = {
      indexTop: "DAN_REPLACE_INDEX_TOP",
    };

    function loadAdFitScript() {
      if (window.__adfitLoaded) return;
      const script = document.createElement("script");
      script.async = true;
      script.src = "https://t1.daumcdn.net/kas/static/ba.min.js";
      script.onload = () => { window.__adfitLoaded = true; };
      document.head.appendChild(script);
    }

    function initAdFit(slotId, unit, width, height) {
      const slot = document.getElementById(slotId);
      if (!slot) return;
      if (!unit || !unit.startsWith("DAN-")) {
        slot.textContent = "광고 단위 ID를 설정하면 이 위치에 배너가 노출됩니다.";
        return;
      }
      slot.innerHTML = `<ins class="kakao_ad_area" style="display:none;" data-ad-unit="${unit}" data-ad-width="${width}" data-ad-height="${height}"></ins>`;
      loadAdFitScript();
    }

    async function fetchJson(path) {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) throw new Error(`fetch failed: ${path}`);
      return res.json();
    }

    /* SOFTM-KNOU 시작: 기존 manifest와 knou_ manifest를 병합 로딩 - 2026-05-29 */
    async function fetchJsonOptional(path, fallback) {
      try {
        return await fetchJson(path);
      } catch (_) {
        return fallback;
      }
    }

    function normalizePdfPath(path) {
      const raw = String(path || "").trim();
      if (!raw) return "";
      return raw.replace(/^\.\//, "").replace(/^quiz\//, "");
    }

    function hasAnswerSource(row) {
      return Boolean(normalizePdfPath(row.answerPdf) || String(row.answerSourceId || "").trim());
    }

    function isPublishedQuestion(row) {
      if (String(row?.correctJson || "").trim()) return true;
      if (String(row?.answerSourceId || "").trim()) return true;
      if (Object.prototype.hasOwnProperty.call(row || {}, "published")) {
        return row?.published === true || String(row?.published) === "true";
      }
      return hasAnswerSource(row);
    }
    // SOFTM-OCR: 메인 노출 기준에서 OCR 품질을 제외하고 correct.json/정답 원본 기준으로 풀이 가능 회차 표시 - 2026-05-30

    function collectDescendantCatNos(categories, catNo) {
      const out = new Set([String(catNo)]);
      let changed = true;
      while (changed) {
        changed = false;
        for (const category of categories) {
          const parent = String(category.parentCatNo || "");
          const current = String(category.catNo || "");
          if (parent && out.has(parent) && !out.has(current)) {
            out.add(current);
            changed = true;
          }
        }
      }
      return out;
    }
    // SOFTM-GEN: correctJson 생성 여부를 퍼블리싱 기준으로 사용하고 하위 카테고리 집계를 지원 - 2026-05-29

    function makeCategoryHref(item) {
      const q = new URLSearchParams({
        catNo: item.catNo,
        category: item.catNm,
      });
      if (item.dataset === "knou") q.set("dataset", "knou");
      return `./category.html?${q.toString()}`;
    }

    function makeSearchText(item) {
      return [
        item.datasetLabel,
        item.gNm,
        item.catNm,
        item.registered,
        item.ready,
      ].join(" ").toLowerCase();
    }

    function renderCards(grid, emptySearch, items, query = "") {
      const keyword = String(query || "").trim().toLowerCase();
      let shown = 0;
      grid.innerHTML = "";

      for (const item of items) {
        if (!item.ready) continue;
        if (!keyword && item.parentCatNo) continue;
        if (keyword && !makeSearchText(item).includes(keyword)) continue;

        const card = document.createElement("a");
        card.className = "banner";
        card.dataset.kind = item.dataset === "knou" ? "knou" : (kindByCategory[item.catNm] || "qcm");
        card.href = makeCategoryHref(item);
        card.innerHTML = `
          <span class="badge">${item.datasetLabel} · ${item.gNm || "카테고리"}</span>
          <h2 class="title">${item.catNm}</h2>
          <p class="count">등록 회차 ${item.registered}개 · 퍼블리싱 ${item.ready}개</p>
          <p class="cta">회차 목록 보기 →</p>
        `;

        grid.appendChild(card);
        shown += 1;
      }

      emptySearch.style.display = shown === 0 ? "block" : "none";
    }

    async function load() {
      const grid = document.getElementById("categoryGrid");
      const generatedAt = document.getElementById("generatedAt");
      const searchInput = document.getElementById("searchInput");
      const searchHelp = document.getElementById("searchHelp");
      const emptySearch = document.getElementById("emptySearch");

      try {
        const [groups, categories, questions, knouGroups, knouCategories, knouQuestions] = await Promise.all([
          fetchJson("./json/group.json"),
          fetchJson("./json/category.json"),
          fetchJson("./json/question.json"),
          fetchJsonOptional("./json/knou_group.json", []),
          fetchJsonOptional("./json/knou_category.json", []),
          fetchJsonOptional("./json/knou_question.json", []),
        ]);

        const sortedGroups = (groups || []).slice().sort((a, b) => Number(a.seq || 0) - Number(b.seq || 0));
        const sortedCategories = (categories || []).slice().sort((a, b) => Number(a.seq || 0) - Number(b.seq || 0));
        const questionList = Array.isArray(questions) ? questions : [];
        const sortedKnouGroups = (knouGroups || []).slice().sort((a, b) => Number(a.seq || 0) - Number(b.seq || 0));
        const sortedKnouCategories = (knouCategories || []).slice().sort((a, b) => Number(a.seq || 0) - Number(b.seq || 0));
        const knouQuestionList = Array.isArray(knouQuestions) ? knouQuestions : [];

        const items = [];
        for (const category of sortedCategories) {
          const catNos = collectDescendantCatNos(sortedCategories, category.catNo);
          const rows = questionList.filter((q) => catNos.has(String(q.catNo)));
          items.push({
            dataset: "default",
            datasetLabel: "기존",
            gNm: category.gNm || "",
            catNm: category.catNm,
            catNo: category.catNo,
            parentCatNo: category.parentCatNo || "",
            registered: rows.length,
            ready: rows.filter((q) => normalizePdfPath(q.questionPdf) && isPublishedQuestion(q)).length,
            seq: Number(category.seq || 0),
          });
        }
        for (const category of sortedKnouCategories) {
          const rows = knouQuestionList.filter((q) => String(q.catNo) === String(category.catNo));
          items.push({
            dataset: "knou",
            datasetLabel: "방통대",
            gNm: category.gNm || "",
            catNm: category.catNm,
            catNo: category.catNo,
            parentCatNo: category.parentCatNo || "",
            registered: rows.length,
            ready: rows.filter((q) => normalizePdfPath(q.questionPdf) && isPublishedQuestion(q)).length,
            seq: Number(category.seq || 0),
          });
        }

        generatedAt.textContent = `기존 그룹 ${sortedGroups.length}개 · 기존 카테고리 ${sortedCategories.length}개 · 방통대 학과 ${sortedKnouGroups.length}개 · 방통대 교과목 ${sortedKnouCategories.length}개`;
        renderCards(grid, emptySearch, items);
        searchInput.addEventListener("input", () => {
          renderCards(grid, emptySearch, items, searchInput.value);
          const count = grid.querySelectorAll(".banner").length;
          searchHelp.textContent = searchInput.value.trim()
            ? `검색 결과 ${count}개`
            : "기존 문제은행과 방통대 교과목을 함께 검색합니다.";
        });
      } catch (err) {
        generatedAt.textContent = "json 데이터(group/category/question)를 불러오지 못했습니다.";
        grid.innerHTML = "";
      }
    }
    /* SOFTM-KNOU 끝 */

    initAdFit("adfitIndexTop", ADFIT_UNITS.indexTop, "728", "90");
    load();
  </script>
</body>
</html>
